<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flappy PRIME</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f1f;overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  canvas{display:block;background:#000;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;}
</style>
</head>
<body>
<canvas id="game" width="288" height="512"></canvas>
<script>
(function(){
'use strict';

var W=288, H=512, GROUND_H=64, GROUND_Y=H-GROUND_H;
var BIRD_W=24, BIRD_H=22;
var GRAV=0.42, FLAP=-7.4, MAX_FALL=9.5, SPEED=2.3;
var PIPE_W=52, CAP_H=14, SPACING=165, BIRD_X=70;
var HARD_SCORE=15, HARD_SPEED=1.25, SLOW_FRAMES=300, INVULN_FRAMES=50, ITEM_CHANCE=0.25, ITEM_SIZE=14;
var CYCLE_PTS=20;
var KEY='flappyPrimeBest';

var cv=document.getElementById('game');
var ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;

function fit(){
  var s=Math.max(0.5,Math.min(window.innerWidth/W,window.innerHeight/H));
  cv.style.width=Math.floor(W*s)+'px';
  cv.style.height=Math.floor(H*s)+'px';
}
window.addEventListener('resize',fit);
fit();

var best=0;
try{ best=parseInt(localStorage.getItem(KEY),10)||0; }catch(e){}
function storeBest(v){ try{ localStorage.setItem(KEY,String(v)); }catch(e){} }

function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

/* ---------- robot sprite (K=outline, B=blue armor, R=red armor, W=eye white, C=cyan optic) ---------- */
var COL={K:'#14142b',B:'#2f6fe0',R:'#e03a3a',W:'#ffffff',C:'#7ff3ff'};
var ROBOT=[
  "....KKKK....",
  "...KBBBBK...",
  "..KBBBBBBK..",
  "..KWWBBWWK..",
  "..KCWBBWCK..",
  "..KKKKKKKK..",
  ".KRRRRRRRRK.",
  "KRRRRRRRRRRK",
  "KRRKRRRRKRRK",
  ".KRRRRRRRRK.",
  "..KK....KK.."
];
/* muzzle-flap frame: the grille row glows cyan while the jets fire */
var ROW_FLAP="KRRKCCCCKRRK";

/* ---------- state ---------- */
var state='ready', frames=0, score=0, shake=0, flash=0;
var pipes=[], bird={x:BIRD_X,y:H/2-80,vy:0};
var deadAt=0, newBest=false, groundOff=0, hillOff=0;
var shield=false, slowLeft=0, invuln=0, flapT=0, hardFlash=0;
var visScore=0;

/* ---------- day/night palettes ---------- */
var PAL={
  day:  {top:[79,182,240],  bot:[191,233,255]},
  dusk: {top:[92,96,190],   bot:[255,166,120]},
  night:{top:[10,14,40],    bot:[40,38,88]}
};
function mixArr(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
/* k: 0 = full day, 0.5 = dusk, 1 = night. Cycle repeats every CYCLE_PTS points. */
function dayCycle(sc){ return 0.5-0.5*Math.cos(2*Math.PI*sc/CYCLE_PTS); }

var STARS=[];
for(var si=0;si<30;si++){ STARS.push({x:(si*97+23)%W, y:12+((si*61)%(GROUND_Y-120))}); }

function drawSky(k){
  var a=(k<0.5)?PAL.day:PAL.dusk;
  var b=(k<0.5)?PAL.dusk:PAL.night;
  var u=(k<0.5)?k*2:(k-0.5)*2;
  var top=mixArr(a.top,b.top,u), bot=mixArr(a.bot,b.bot,u);
  var bands=24, bh=Math.ceil(H/bands);
  for(var i=0;i<bands;i++){
    var c=mixArr(top,bot,i/(bands-1));
    ctx.fillStyle='rgb('+Math.round(c[0])+','+Math.round(c[1])+','+Math.round(c[2])+')';
    ctx.fillRect(0,i*bh,W,bh);
  }
}
function drawStars(k){
  var a=clamp((k-0.6)/0.4,0,1);
  if(a<=0) return;
  ctx.globalAlpha=a;
  ctx.fillStyle='#ffffff';
  for(var i=0;i<STARS.length;i++){
    var s=STARS[i];
    var tw=(Math.floor(frames/40)+i)%4===0 ? 1 : 2;
    ctx.fillRect(s.x, s.y, tw, tw);
  }
  ctx.globalAlpha=1;
}

var HILLS=[];
for(var hi=0;hi<W;hi++){
  HILLS.push(Math.round(18+12*Math.sin(2*Math.PI*hi/144)+6*Math.sin(2*Math.PI*hi/72+1)));
}

var CLOUD=[
  "....XXXX....",
  "..XXXXXXXX..",
  ".XXXXXXXXXX.",
  "XXXXXXXXXXXX",
  "XXXXXXXXXXXX",
  "SSSSSSSSSSSS"
];
var LAYERS=[
  {speed:0.25, ps:3, color:'#ffffff', shade:'#d3e9f5', alpha:0.8, count:4, ymin:30, ymax:200, items:[], behindHills:true},
  {speed:0.55, ps:4, color:'#ffffff', shade:'#c4e0f2', alpha:0.95, count:3, ymin:90, ymax:270, items:[], behindHills:false}
];
var nightAmt=0;
function initClouds(){
  LAYERS.forEach(function(L){
    L.items=[];
    for(var k=0;k<L.count;k++){
      L.items.push({x:Math.random()*W, y:L.ymin+Math.random()*(L.ymax-L.ymin)});
    }
  });
}
function updateClouds(f){
  LAYERS.forEach(function(L){
    L.items.forEach(function(c){
      c.x-=L.speed*f;
      if(c.x< -CLOUD[0].length*L.ps){
        c.x=W+Math.random()*40;
        c.y=L.ymin+Math.random()*(L.ymax-L.ymin);
      }
    });
  });
}
function drawLayer(L){
  ctx.globalAlpha=L.alpha*(1-0.45*nightAmt);
  L.items.forEach(function(c){
    for(var r=0;r<CLOUD.length;r++){
      for(var col=0;col<CLOUD[r].length;col++){
        var ch=CLOUD[r][col];
        if(ch==='.') continue;
        ctx.fillStyle = ch==='S' ? L.shade : L.color;
        ctx.fillRect(Math.floor(c.x+col*L.ps), Math.floor(c.y+r*L.ps), L.ps, L.ps);
      }
    }
  });
  ctx.globalAlpha=1;
}
function drawHills(){
  var off=Math.floor(hillOff);
  ctx.fillStyle='#8fd3a8';
  for(var i=0;i<W;i++){
    var h=HILLS[(i+off)%W];
    ctx.fillRect(i, GROUND_Y-30-h, 1, h+30);
  }
  ctx.fillStyle='#6fbf8a';
  for(var j=0;j<W;j++){
    var h2=Math.round(HILLS[(j+off+70)%W]*0.5);
    ctx.fillRect(j, GROUND_Y-14-h2, 1, h2+14);
  }
}
function drawGround(){
  ctx.fillStyle='#6cc04a';
  ctx.fillRect(0,GROUND_Y,W,14);
  ctx.fillStyle='#3f8f2a';
  ctx.fillRect(0,GROUND_Y,W,3);
  ctx.fillStyle='#e2b06a';
  ctx.fillRect(0,GROUND_Y+14,W,H-GROUND_Y-14);
  ctx.fillStyle='#c98d45';
  var off=Math.floor(groundOff)%24;
  for(var x=-off;x<W;x+=24){
    ctx.fillRect(x, GROUND_Y+26, 12, 4);
    ctx.fillRect(x+8, GROUND_Y+40, 10, 4);
  }
}

/* ---------- pipes ---------- */
function pipeBox(x,y,w,h,body){
  if(h<=0) return;
  ctx.fillStyle=COL.K; ctx.fillRect(x,y,w,h);
  ctx.fillStyle=body; ctx.fillRect(x+2,y+2,w-4,h-4);
}
function drawPipeBody(x,y,w,h){
  if(h<=0) return;
  pipeBox(x,y,w,h,'#4cc44c');
  ctx.fillStyle='#9af59a'; ctx.fillRect(x+5,y+3,5,Math.max(0,h-6));
  ctx.fillStyle='#2c8a2c'; ctx.fillRect(x+w-10,y+3,5,Math.max(0,h-6));
}
function drawPipeCap(x,y,w,h){
  pipeBox(x,y,w,h,'#5fd65f');
  ctx.fillStyle='#b5ffb5'; ctx.fillRect(x+4,y+3,6,h-6);
  ctx.fillStyle='#2c8a2c'; ctx.fillRect(x+w-10,y+3,6,h-6);
}
function drawPipe(p){
  var gy=p.top+p.gap;
  drawPipeBody(p.x+6, 0, PIPE_W-12, p.top-CAP_H);
  drawPipeCap(p.x-4, p.top-CAP_H, PIPE_W+8, CAP_H);
  drawPipeCap(p.x-4, gy, PIPE_W+8, CAP_H);
  drawPipeBody(p.x+6, gy+CAP_H, PIPE_W-12, GROUND_Y-(gy+CAP_H));
}
function gapFor(){
  /* hard mode: narrower gaps after HARD_SCORE */
  if(score>=HARD_SCORE) return 96+Math.floor(Math.random()*7);
  return 108+Math.floor(Math.random()*17);
}
function speedNow(){
  return score>=HARD_SCORE ? SPEED*HARD_SPEED : SPEED;
}
function addPipe(x){
  var gap=gapFor();
  var minTop=70, maxTop=GROUND_Y-70-gap;
  var p={x:x, gap:gap, top:Math.floor(minTop+Math.random()*(maxTop-minTop)), passed:false, item:null};
  if(score>=2 && Math.random()<ITEM_CHANCE){
    p.item={type: Math.random()<0.5 ? 'shield' : 'slow', taken:false};
  }
  pipes.push(p);
}
/* power-up orb sits in the middle of the gap */
function drawItem(p){
  if(!p.item || p.item.taken) return;
  var cx=p.x+PIPE_W/2, cy=p.top+p.gap/2;
  var pulse=Math.sin(frames*0.12)*1.5;
  var isShield=p.item.type==='shield';
  ctx.fillStyle=COL.K;
  ctx.beginPath(); ctx.arc(cx,cy,9+pulse,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=isShield?'#7ff3ff':'#c58bff';
  ctx.beginPath(); ctx.arc(cx,cy,7+pulse,0,Math.PI*2); ctx.fill();
  txt(isShield?'S':'T', cx, cy, 11, '#ffffff');
}

/* ---------- bird ---------- */
function drawBird(){
  var cx=bird.x+BIRD_W/2, cy=bird.y+BIRD_H/2;
  var ang = (state==='ready') ? 0 : clamp(bird.vy*0.06, -0.45, 0.9);
  var blink = invuln>0 && Math.floor(frames/4)%2===0;
  ctx.save();
  ctx.translate(Math.round(cx),Math.round(cy));
  ctx.rotate(ang);
  ctx.translate(-BIRD_W/2,-BIRD_H/2);
  if(blink) ctx.globalAlpha=0.35;
  for(var r=0;r<ROBOT.length;r++){
    var row = (r===8 && flapT>0) ? ROW_FLAP : ROBOT[r];
    for(var c=0;c<row.length;c++){
      var ch=row[c];
      if(ch==='.') continue;
      ctx.fillStyle=COL[ch];
      ctx.fillRect(c*2, r*2, 2, 2);
    }
  }
  if(flapT>0){
    /* jet puffs under the feet, flicker each frame */
    for(var k=0;k<3;k++){
      ctx.fillStyle=((k+Math.floor(frames))%2) ? '#ffb347' : '#ffe27a';
      ctx.fillRect(7+k*4, BIRD_H+1+(k%2)*2, 2, 2);
    }
  }
  ctx.restore();
  if(shield){
    ctx.strokeStyle='#7ff3ff';
    ctx.lineWidth=2;
    ctx.globalAlpha=0.85;
    ctx.beginPath();
    ctx.arc(cx,cy,17+Math.sin(frames*0.2),0,Math.PI*2);
    ctx.stroke();
    ctx.globalAlpha=1;
  }
}

/* ---------- text ---------- */
function txt(s,x,y,size,color){
  ctx.font='bold '+size+'px "Courier New", Courier, monospace';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.lineJoin='round';
  ctx.lineWidth=Math.max(3,Math.round(size/6));
  ctx.strokeStyle=COL.K;
  ctx.strokeText(s,x,y);
  ctx.fillStyle=color;
  ctx.fillText(s,x,y);
}
/* small HUD tag, returns its width */
function hudTag(s,x,y,color,right){
  ctx.font='bold 10px "Courier New", Courier, monospace';
  ctx.textAlign='left';
  ctx.textBaseline='middle';
  var w=Math.ceil(ctx.measureText(s).width)+10, h=16;
  var bx=right ? x-w : x;
  ctx.fillStyle=COL.K; ctx.fillRect(bx,y,w,h);
  ctx.fillStyle=color; ctx.fillRect(bx+2,y+2,w-4,h-4);
  ctx.fillStyle=COL.K; ctx.fillText(s,bx+5,y+h/2+0.5);
  return w;
}
function drawHUD(){
  var y=10;
  if(shield){ hudTag('SHIELD',8,y,'#7ff3ff'); y+=22; }
  if(slowLeft>0){
    hudTag('SLOW',8,y,'#c58bff');
    var fr=slowLeft/SLOW_FRAMES;
    ctx.fillStyle=COL.K; ctx.fillRect(8,y+18,64,5);
    ctx.fillStyle='#c58bff'; ctx.fillRect(9,y+19,Math.round(62*fr),3);
    y+=28;
  }
  if(score>=HARD_SCORE){ hudTag('HARD',W-8,10,'#ff5a4a',true); }
}

/* ---------- sound (tiny retro blips) ---------- */
var ac=null;
function beep(freq,dur,type){
  try{
    if(!ac){ var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; ac=new AC(); }
    var o=ac.createOscillator(), g=ac.createGain();
    o.type=type||'square';
    o.frequency.value=freq;
    g.gain.value=0.05;
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime+dur);
  }catch(e){}
}

/* ---------- game logic ---------- */
function reset(){
  bird={x:BIRD_X, y:H/2-80, vy:0};
  pipes=[];
  score=0;
  newBest=false;
  shake=0; flash=0;
  shield=false; slowLeft=0; invuln=0; flapT=0; hardFlash=0;
}
function flapNow(){
  bird.vy=FLAP;
  flapT=12;
  beep(520,0.05,'square');
}
function die(){
  if(state!=='play') return;
  state='dead';
  deadAt=frames;
  shake=10;
  flash=1;
  beep(140,0.35,'sawtooth');
  if(score>best){
    best=score;
    newBest=true;
    storeBest(best);
  }
}
/* returns true if the bird should die now; the shield eats one hit and grants brief invulnerability */
function hitBird(){
  if(invuln>0) return false;
  if(shield){
    shield=false;
    invuln=INVULN_FRAMES;
    flash=0.5;
    shake=4;
    beep(1000,0.15,'triangle');
    return false;
  }
  return true;
}
function action(){
  if(state==='ready'){ state='play'; flapNow(); }
  else if(state==='play'){ flapNow(); }
  else if(state==='dead' && frames-deadAt>35){ reset(); state='play'; flapNow(); }
}
function overlap(ax,ay,aw,ah,bx,by,bw,bh){
  return ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by;
}

function update(f0){
  frames+=f0;
  /* slow-time power-up scales the world (and the bird's physics) by half */
  var f=f0*(slowLeft>0 ? 0.5 : 1);
  visScore+=(score-visScore)*Math.min(1,0.05*f0);
  updateClouds(f);
  hillOff+=0.35*f;
  groundOff+=speedNow()*f;
  if(shake>0) shake=Math.max(0,shake-0.6*f0);
  if(flash>0) flash=Math.max(0,flash-0.05*f0);

  if(state==='ready'){
    bird.vy=0;
    bird.y=H/2-80+Math.sin(frames*0.08)*6;
    return;
  }

  if(state==='play'){
    if(slowLeft>0) slowLeft=Math.max(0,slowLeft-f0);
    if(invuln>0) invuln=Math.max(0,invuln-f0);
    if(flapT>0) flapT=Math.max(0,flapT-f0);
    if(hardFlash>0) hardFlash=Math.max(0,hardFlash-f0);

    bird.vy=Math.min(MAX_FALL,bird.vy+GRAV*f);
    bird.y+=bird.vy*f;
    if(bird.y<0){ bird.y=0; bird.vy=0; }

    var spd=speedNow()*f;
    for(var i=0;i<pipes.length;i++) pipes[i].x-=spd;
    if(!pipes.length || pipes[pipes.length-1].x < W-SPACING) addPipe(W+20);
    while(pipes.length && pipes[0].x+PIPE_W < -10) pipes.shift();

    var hx=bird.x+3, hy=bird.y+3, hw=BIRD_W-6, hh=BIRD_H-6;
    for(var j=0;j<pipes.length;j++){
      var p=pipes[j];
      if(!p.passed && p.x+PIPE_W < BIRD_X){
        p.passed=true;
        score++;
        beep(880,0.07,'square');
        if(score===HARD_SCORE){ hardFlash=150; beep(330,0.2,'sawtooth'); }
      }
      if(p.item && !p.item.taken){
        var ix=p.x+PIPE_W/2-ITEM_SIZE/2, iy=p.top+p.gap/2-ITEM_SIZE/2;
        if(overlap(hx,hy,hw,hh,ix,iy,ITEM_SIZE,ITEM_SIZE)){
          p.item.taken=true;
          if(p.item.type==='shield'){ shield=true; beep(1320,0.12,'triangle'); }
          else { slowLeft=SLOW_FRAMES; beep(260,0.25,'triangle'); }
        }
      }
      var gy=p.top+p.gap;
      if(overlap(hx,hy,hw,hh,p.x,0,PIPE_W,p.top) ||
         overlap(hx,hy,hw,hh,p.x,gy,PIPE_W,GROUND_Y-gy)){
        if(hitBird()){ die(); return; }
      }
    }
    if(bird.y+BIRD_H>=GROUND_Y){
      bird.y=GROUND_Y-BIRD_H;
      if(hitBird()){ die(); }
      else { bird.vy=FLAP*0.6; }
    }
    return;
  }

  if(state==='dead'){
    bird.vy=Math.min(MAX_FALL,bird.vy+GRAV*f);
    bird.y+=bird.vy*f;
    if(bird.y+BIRD_H>=GROUND_Y){ bird.y=GROUND_Y-BIRD_H; bird.vy=0; }
  }
}

/* ---------- rendering ---------- */
function drawScore(){
  txt(String(score), W/2, 60, 40, '#ffffff');
}
function drawTitle(){
  txt('FLAPPY', W/2, 150, 38, '#ff5a4a');
  txt('PRIME', W/2, 192, 44, '#4aa8ff');
  txt('robot warrior edition', W/2, 230, 13, '#ffffff');
  if(Math.floor(frames/30)%2===0) txt('tap or space to flap', W/2, 300, 15, '#ffffff');
  txt('BEST '+best, W/2, 340, 16, '#ffe27a');
}
function drawGameOver(){
  ctx.fillStyle=COL.K;
  ctx.fillRect(W/2-112,130,224,232);
  ctx.fillStyle='#fff4d6';
  ctx.fillRect(W/2-108,134,216,224);
  txt('GAME OVER', W/2, 172, 26, '#e03a3a');
  txt('SCORE', W/2, 214, 14, '#14142b');
  txt(String(score), W/2, 240, 30, '#14142b');
  txt('BEST', W/2, 276, 14, '#14142b');
  txt(String(best), W/2, 300, 26, '#14142b');
  if(newBest && Math.floor(frames/20)%2===0) txt('NEW BEST!', W/2, 330, 16, '#e03a3a');
  if(frames-deadAt>35 && Math.floor(frames/25)%2===0) txt('tap or space to retry', W/2, 390, 15, '#ffffff');
}
function render(){
  var k=dayCycle(visScore);
  nightAmt=clamp((k-0.5)*2,0,1);
  ctx.save();
  if(shake>0.5){
    ctx.translate(Math.round((Math.random()*2-1)*shake), Math.round((Math.random()*2-1)*shake));
  }
  drawSky(k);
  drawStars(k);
  drawLayer(LAYERS[0]);
  drawHills();
  drawLayer(LAYERS[1]);
  for(var i=0;i<pipes.length;i++) drawPipe(pipes[i]);
  for(var j=0;j<pipes.length;j++) drawItem(pipes[j]);
  drawGround();
  drawBird();
  ctx.restore();

  if(flash>0){
    ctx.fillStyle='rgba(255,255,255,'+(flash*0.7).toFixed(3)+')';
    ctx.fillRect(0,0,W,H);
  }
  if(state==='play'){
    drawScore();
    drawHUD();
    if(hardFlash>0) txt('HARD MODE', W/2, 110, 18, '#ff5a4a');
  }
  else if(state==='ready') drawTitle();
  else if(state==='dead') drawGameOver();
}

/* ---------- input ---------- */
window.addEventListener('pointerdown', function(e){
  if(e.preventDefault) e.preventDefault();
  action();
}, {passive:false});
window.addEventListener('touchstart', function(e){
  if(e.cancelable) e.preventDefault();
}, {passive:false});
window.addEventListener('touchmove', function(e){
  if(e.cancelable) e.preventDefault();
}, {passive:false});
window.addEventListener('keydown', function(e){
  if(e.code==='Space' || e.code==='ArrowUp' || e.code==='Enter'){
    if(e.preventDefault) e.preventDefault();
    if(!e.repeat) action();
  }
});
window.addEventListener('contextmenu', function(e){ e.preventDefault(); });

/* ---------- loop ---------- */
reset();
initClouds();
var lastT=null;
function loop(t){
  var dt=(lastT===null)?16.667:(t-lastT);
  lastT=t;
  if(!(dt>0)) dt=16.667;
  dt=Math.min(dt,50);
  var f=dt/(1000/60);
  update(f);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
