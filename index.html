<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Prime: Earth Seasons</title>
<style>
  html,body{margin:0;height:100%;background:#0b1a12;overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  canvas{display:block;background:#0b1a12;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;}
</style>
</head>
<body>
<canvas id="game" width="288" height="512"></canvas>
<script>
(function(){
'use strict';

/* Prime: Earth Seasons. Single-file canvas game, no dependencies.
   Four seasons (SPRING, SUMMER, AUTUMN, WINTER) cycle every 20 points with a gradual 8 second crossfade.
   Each season has its own sky, hills, weather particles, pillars and music mood.
   Day and night drift within every season: the sun or moon crosses the sky and night palettes take over. */
var W=288, H=512, GROUND_H=64, GROUND_Y=H-GROUND_H;
var BIRD_W=24, BIRD_H=22;
var GRAV=0.42, FLAP=-7.4, MAX_FALL=9.5, SPEED=2.3;
var GATE_W=52, CAP_H=14, SPACING=165, BIRD_X=70;
var INVULN_FRAMES=50, ITEM_CHANCE=1/8, ITEM_SIZE=14;
var TIER_PTS=[0,25,50];                     /* difficulty tiers: NORMAL, MEDIUM at 25, HARD at 50 */
var TIER_NAMES=['NORMAL','MEDIUM','HARD'];
var TIER_SPEED=[1,1.12,1.25];               /* scroll multiplier per tier */
var TIER_GAP_CUT=[0,8,16];                  /* px taken off pillar gaps per tier (floor 88) */
var TIER_ITEM_CHANCE=[1/8,1/8,1/14];        /* shield orb odds per gate per tier */
var tier=0, tierBanner={text:'',t:0};
var ZONE_PTS=20, ZONE_BLEND_FRAMES=480;   /* 480 frames = 8 seconds at 60fps */
var DAY_LEN=3600;                          /* one full day and night = 60 seconds */
var KEY='flappyPrimeBest';
var MUTE_KEY='flappyPrimeMuted';
var MUTE_BOX={x:W-30,y:8,w:22,h:22};
var paused=false;
var BACK_URL='hub/';
var SEASON_NAMES=['SPRING','SUMMER','AUTUMN','WINTER'];

var cv=document.getElementById('game');
var ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;

function fit(){
  var s=Math.max(0.5,Math.min(window.innerWidth/W,window.innerHeight/H));
  cv.style.width=Math.floor(W*s)+'px';
  cv.style.height=Math.floor(H*s)+'px';
}
window.addEventListener('resize',fit);
fit();

var best=0;
try{ best=parseInt(localStorage.getItem(KEY),10)||0; }catch(e){}
function storeBest(v){ try{ localStorage.setItem(KEY,String(v)); }catch(e){} }

var muted=false;
try{ muted=localStorage.getItem(MUTE_KEY)==='1'; }catch(e){}

function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function smooth01(t){ t=clamp(t,0,1); return t*t*(3-2*t); }
function lerpC(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
function rgb(c,a){
  return 'rgba('+Math.round(c[0])+','+Math.round(c[1])+','+Math.round(c[2])+','+(a===undefined?1:a).toFixed(3)+')';
}

/* ---------- robot sprite (K=outline, B=blue armor, R=red armor, W=eye white, C=cyan optic) ---------- */
var COL={K:'#14142b',B:'#2f6fe0',R:'#e03a3a',W:'#ffffff',C:'#7ff3ff'};
var ROBOT=[
  "....KKKK....",
  "...KBBBBK...",
  "..KBBBBBBK..",
  "..KWWBBWWK..",
  "..KCWBBWCK..",
  "..KKKKKKKK..",
  ".KRRRRRRRRK.",
  "KRRRRRRRRRRK",
  "KRRKRRRRKRRK",
  ".KRRRRRRRRK.",
  "..KK....KK.."
];
/* muzzle-flap frame: the grille row glows while the jets fire */
var ROW_FLAP="KRRKCCCCKRRK";

/* ---------- seasons: day and night palettes (all rgb arrays so they can be blended) ---------- */
var PAL_DAY=[
  { /* SPRING: soft bright sky, fresh green hills, blossom */
    top:[136,206,250], mid:[196,236,255], bot:[222,246,204],
    hillFar:[164,222,156], hillNear:[104,192,98], ground:[120,190,84], groundDark:[78,136,56],
    rim:[255,160,200], glow:[255,190,220], body:[255,246,206]
  },
  { /* SUMMER: warm golden sky, sun, sandstone */
    top:[255,190,96], mid:[255,224,150], bot:[246,166,94],
    hillFar:[236,192,124], hillNear:[218,156,96], ground:[226,176,110], groundDark:[170,114,66],
    rim:[255,200,90], glow:[255,190,80], body:[255,222,90]
  },
  { /* AUTUMN: amber sky, falling leaves, warm trees */
    top:[242,160,76], mid:[252,202,122], bot:[232,132,66],
    hillFar:[206,132,72], hillNear:[170,98,50], ground:[150,92,44], groundDark:[94,54,28],
    rim:[255,178,70], glow:[255,150,60], body:[255,176,82]
  },
  { /* WINTER: pale cold sky, snow and ice */
    top:[180,214,242], mid:[222,238,250], bot:[244,249,255],
    hillFar:[208,226,240], hillNear:[238,246,252], ground:[246,250,255], groundDark:[196,216,236],
    rim:[150,226,255], glow:[160,220,255], body:[250,252,255]
  }
];
var PAL_NIGHT=[
  { /* SPRING night: indigo-teal, moon, stars */
    top:[16,30,64], mid:[34,62,98], bot:[50,90,104],
    hillFar:[30,60,70], hillNear:[22,50,50], ground:[30,70,46], groundDark:[14,40,28],
    rim:[210,160,220], glow:[160,160,220], body:[226,236,255]
  },
  { /* SUMMER night: desert dusk, plum and rust */
    top:[40,18,44], mid:[96,44,66], bot:[150,72,58],
    hillFar:[80,44,52], hillNear:[60,34,40], ground:[108,58,40], groundDark:[64,32,24],
    rim:[255,150,90], glow:[220,120,90], body:[238,226,220]
  },
  { /* AUTUMN night: dusky plum, low ember glow */
    top:[44,22,36], mid:[92,42,44], bot:[126,62,40],
    hillFar:[72,40,40], hillNear:[52,28,30], ground:[80,44,30], groundDark:[46,24,18],
    rim:[230,140,70], glow:[200,110,60], body:[238,214,180]
  },
  { /* WINTER night: deep navy, pale ice glow */
    top:[12,24,48], mid:[30,50,86], bot:[60,84,120],
    hillFar:[52,70,100], hillNear:[120,140,170], ground:[170,190,215], groundDark:[100,120,150],
    rim:[120,210,255], glow:[120,190,240], body:[210,226,255]
  }
];
/* pillar styles: each gate keeps the season it spawned in */
var PILLAR=[
  { s0:'#4f8f4e', s1:'#8fd08a', s2:'#2f6a42', band:'#2e5e3a', cap:'#b8e89c', rimc:'#ffb3d1',
    blossom:['#ffb3d1','#ffd6e6','#ff8fbf'], glow:'#ffb3d1' },
  { s0:'#c98a52', s1:'#f4d29a', s2:'#a8603a', band:'#7a3e22', cap:'#c96a3e', rimc:'#ffc65a',
    glow:'#ffb060' },
  { s0:'#4a2f1a', s1:'#8a5a34', s2:'#3a2412', bark:'#241409', cap:'#5a3a20', rimc:'#ff9a3a',
    leaves:['#ff8c2a','#e25c1a','#ffb84d'], glow:'#ffa040' },
  { s0:'#7fc4e8', s1:'#e6fbff', s2:'#4f9ed0', cap:'#d8f4ff', icicle:'#eefcff', rimc:'#9fe6ff',
    glow:'#bff1ff' }
];
/* music per season: chord loops, filter brightness, level */
var SEASON_MUSIC=[
  { chords:[[60,64,67,72],[57,62,66,71],[53,57,60,64],[55,59,62,67]], lp:1500, gain:1.0 },  /* spring: light, major */
  { chords:[[55,59,62,67],[53,57,60,64],[48,52,55,60],[50,54,57,62]], lp:900,  gain:1.0 },  /* summer: warm, low */
  { chords:[[57,60,64,69],[50,53,57,62],[53,57,60,65],[55,59,62,67]], lp:650,  gain:0.9 },  /* autumn: mellow, minor */
  { chords:[[62,67,71,74],[59,64,67,71],[64,67,71,76],[57,64,67,72]], lp:1800, gain:0.7 }   /* winter: quiet, crisp */
];

/* ---------- live state: palette, blend and day/night are recomputed every frame ---------- */
var PAL=null, BLEND=1, DAYNESS=1, NIGHT=0, BODY_A=0;
function palFor(s,n){
  var D=PAL_DAY[s], N=PAL_NIGHT[s], o={};
  for(var k in D){ if(D.hasOwnProperty(k)) o[k]=lerpC(D[k],N[k],n); }
  return o;
}
function computePal(){
  /* starts at noon, one full day and night every DAY_LEN frames */
  BODY_A=Math.PI/2+2*Math.PI*frames/DAY_LEN;
  var sinA=Math.sin(BODY_A);
  DAYNESS=smooth01((sinA+0.35)/0.7);
  NIGHT=1-DAYNESS;
  BLEND=smooth01(blendF);
  var A=palFor(zoneFrom%4,NIGHT), B=palFor(zoneN%4,NIGHT);
  PAL={};
  for(var k in A){ if(A.hasOwnProperty(k)) PAL[k]=lerpC(A[k],B[k],BLEND); }
}
/* how much each season should show right now (fades out and in during the crossfade) */
function sw(s){
  var w=0;
  if(zoneFrom%4===s) w+=1-BLEND;
  if(zoneN%4===s) w+=BLEND;
  return w;
}

/* ---------- state ---------- */
var state='ready', frames=0, score=0, shake=0, flash=0;
var gates=[], bird={x:BIRD_X,y:H/2-80,vy:0};
var deadAt=0, newBest=false, groundOff=0, hillOff=0;
var shield=false, invuln=0, flapT=0;
var zoneN=0, zoneFrom=0, blendF=1;
var visScore=0;

/* ---------- sky ---------- */
function drawSky(){
  var lg=ctx.createLinearGradient(0,0,0,GROUND_Y);
  lg.addColorStop(0,rgb(PAL.top,1));
  lg.addColorStop(0.55,rgb(PAL.mid,1));
  lg.addColorStop(1,rgb(PAL.bot,1));
  ctx.fillStyle=lg;
  ctx.fillRect(0,0,W,H);
}

/* ---------- sun by day, moon by night, both crossing the sky on an arc ---------- */
function drawBodies(){
  var a=BODY_A;
  var sx=W*0.5-W*0.42*Math.cos(a), sy=280-240*Math.sin(a);
  var mx=W*0.5+W*0.42*Math.cos(a), my=280+240*Math.sin(a);
  if(DAYNESS>0.02) drawSun(sx,sy,DAYNESS);
  if(NIGHT>0.02) drawMoon(mx,my,NIGHT);
}
function drawSun(x,y,a){
  var g=ctx.createRadialGradient(x,y,6,x,y,64);
  g.addColorStop(0,rgb(PAL.glow,0.45*a));
  g.addColorStop(1,rgb(PAL.glow,0));
  ctx.fillStyle=g;
  ctx.fillRect(x-64,y-64,128,128);
  ctx.fillStyle=rgb(PAL.body,a);
  ctx.beginPath(); ctx.arc(x,y,13,0,Math.PI*2); ctx.fill();
}
function drawMoon(x,y,a){
  var g=ctx.createRadialGradient(x,y,4,x,y,38);
  g.addColorStop(0,rgb(PAL.glow,0.25*a));
  g.addColorStop(1,rgb(PAL.glow,0));
  ctx.fillStyle=g;
  ctx.fillRect(x-38,y-38,76,76);
  ctx.fillStyle=rgb(PAL.body,a);
  ctx.beginPath(); ctx.arc(x,y,10,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=rgb(PAL.top,0.25*a);
  ctx.beginPath(); ctx.arc(x-3,y-2,2.2,0,Math.PI*2); ctx.arc(x+3,y+3,1.6,0,Math.PI*2); ctx.fill();
}

/* ---------- stars: only at night ---------- */
var STARS=[];
for(var si=0;si<60;si++){
  STARS.push({x:Math.random()*W, y:Math.random()*240, sz:Math.random()<0.25?2:1, tw:Math.random()*6.28});
}
function drawStars(){
  if(NIGHT<0.02) return;
  STARS.forEach(function(s){
    s.tw+=0.03;
    ctx.globalAlpha=NIGHT*(0.45+0.55*Math.sin(s.tw));
    ctx.fillStyle=rgb(PAL.body,1);
    ctx.fillRect(Math.floor(s.x), Math.floor(s.y), s.sz, s.sz);
  });
  ctx.globalAlpha=1;
}

/* ---------- hills: two parallax ridges, each season adds its own decor ---------- */
function ridgePath(base,amp,sp,seed){
  ctx.beginPath();
  ctx.moveTo(0,GROUND_Y);
  for(var x=0;x<=W+8;x+=8){
    var xx=x+hillOff*sp;
    var y=base+Math.sin(xx*0.02+seed)*amp+Math.sin(xx*0.051+seed*2)*amp*0.35;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W,GROUND_Y);
  ctx.closePath();
}
function drawHills(){
  ctx.fillStyle=rgb(PAL.hillFar,1);
  ridgePath(300,22,0.15,0); ctx.fill();
  /* season decor on the far ridge */
  var wSp=sw(3), wSu=sw(1), wAu=sw(2);
  if(wSp>0.01 || wSu>0.01 || wAu>0.01){
    var i;
    if(wSu>0.01){
      ctx.globalAlpha=wSu*(1-0.5*NIGHT)+0.0;
      ctx.fillStyle='#c97a48';
      for(i=0;i<5;i++){
        var mx=mod(i*88-hillOff*0.15,W+100)-50;
        ctx.beginPath(); ctx.moveTo(mx,300); ctx.lineTo(mx+6,276); ctx.lineTo(mx+34,276); ctx.lineTo(mx+40,300); ctx.closePath(); ctx.fill();
      }
      ctx.globalAlpha=1;
    }
    if(wAu>0.01){
      ctx.globalAlpha=wAu*(1-0.5*NIGHT);
      ctx.strokeStyle='#4a2a14'; ctx.lineWidth=2;
      for(i=0;i<5;i++){
        var tx=mod(i*80-hillOff*0.2,W+80)-40;
        ctx.beginPath();
        ctx.moveTo(tx,300); ctx.lineTo(tx,266);
        ctx.moveTo(tx,280); ctx.lineTo(tx-8,268);
        ctx.moveTo(tx,272); ctx.lineTo(tx+9,260);
        ctx.stroke();
      }
      ctx.globalAlpha=1;
    }
  }
  ctx.fillStyle=rgb(PAL.hillNear,1);
  ridgePath(352,14,0.3,1.7); ctx.fill();
  if(wSp>0.01){
    ctx.globalAlpha=wSp*(1-0.35*NIGHT);
    for(i=0;i<5;i++){
      var bx=mod(i*80-hillOff*0.3,W+80)-40;
      ctx.fillStyle='#6b4a2a';
      ctx.fillRect(bx-1,338,2,14);
      ctx.fillStyle='#ffb3d1';
      ctx.beginPath(); ctx.arc(bx,332,9,0,Math.PI*2); ctx.arc(bx+6,330,7,0,Math.PI*2); ctx.arc(bx-6,331,7,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#ff8fbf';
      ctx.fillRect(bx+2,334,2,2); ctx.fillRect(bx-4,329,2,2);
    }
    ctx.globalAlpha=1;
  }
  if(wSp>0.01 || wSu>0.01){
    /* nothing extra on the near ridge for summer, its tone carries the sand */
  }
  if(sw(3)>0.01){
    ctx.globalAlpha=sw(3)*0.9;
    ctx.strokeStyle='#ffffff'; ctx.lineWidth=4;
    ridgePath(300-8,22,0.15,0); ctx.stroke();
    ridgePath(352-6,14,0.3,1.7); ctx.stroke();
    ctx.globalAlpha=1;
  }
}
function mod(a,n){ return ((a%n)+n)%n; }

/* ---------- heat shimmer (summer) ---------- */
function drawHeat(){
  var w=sw(1);
  if(w<0.01) return;
  ctx.strokeStyle='rgba(255,240,200,'+(0.10*w*(1-0.6*NIGHT)).toFixed(3)+')';
  ctx.lineWidth=1;
  for(var r=0;r<6;r++){
    ctx.beginPath();
    var yy=330+r*18;
    for(var x=0;x<=W;x+=6){
      var y=yy+Math.sin(x*0.09+frames*0.09+r)*1.6;
      if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
}

/* ---------- weather particles: petals, sand motes, leaves, snow. dimmed at night ---------- */
var PARTS=[];
for(var ps=0;ps<4;ps++){
  for(var pi=0;pi<22;pi++){
    PARTS.push({s:ps, x:Math.random()*W, y:Math.random()*GROUND_Y, ph:Math.random()*6.28, sz:0.7+Math.random()*0.6, c:Math.floor(Math.random()*3)});
  }
}
function updateParts(f){
  PARTS.forEach(function(p){
    p.ph+=0.04*f;
    if(p.s===0){ /* spring petals drift down and sideways */
      p.y+=0.7*f; p.x+=(-0.5+0.5*Math.sin(p.ph))*f;
    } else if(p.s===1){ /* summer dust specks skim left */
      p.y+=0.15*f*Math.sin(p.ph*0.5); p.x-=1.3*f;
    } else if(p.s===2){ /* autumn leaves tumble and fall */
      p.y+=0.9*f; p.x+=(-0.6+0.6*Math.sin(p.ph))*f;
    } else { /* winter snow falls slowly with a sway */
      p.y+=0.8*f; p.x+=(-0.15+0.4*Math.sin(p.ph))*f;
    }
    if(p.y>GROUND_Y+4 || p.x<-8){
      p.y=-6; p.x=Math.random()*(W+20);
    }
  });
}
var LEAVES=['#ff8c2a','#c2491a','#ffb84d','#d9542a'];
function drawParts(){
  var dim=1-0.65*NIGHT;
  PARTS.forEach(function(p){
    var w=sw(p.s);
    if(w<0.02) return;
    var a=w*dim;
    if(p.s===0){
      ctx.fillStyle='rgba(255,176,206,'+(0.92*a).toFixed(3)+')';
      ctx.fillRect(Math.floor(p.x),Math.floor(p.y),3,2);
    } else if(p.s===1){
      ctx.fillStyle='rgba(255,226,170,'+(0.55*a).toFixed(3)+')';
      ctx.fillRect(Math.floor(p.x),Math.floor(p.y),2,1);
    } else if(p.s===2){
      ctx.fillStyle=LEAVES[p.c+0]; ctx.globalAlpha=a;
      ctx.fillRect(Math.floor(p.x),Math.floor(p.y),3,3);
      ctx.fillStyle=LEAVES[3]; ctx.fillRect(Math.floor(p.x)+1,Math.floor(p.y)+1,2,1);
      ctx.globalAlpha=1;
    } else {
      ctx.fillStyle='rgba(255,255,255,'+(0.9*a).toFixed(3)+')';
      ctx.fillRect(Math.floor(p.x),Math.floor(p.y),p.sz>1?2:1,p.sz>1?2:1);
    }
  });
}

/* ---------- ground: season surfaces blend with the palette ---------- */
function groundDecor(s){
  var off=groundOff;
  var x;
  if(s===0){ /* spring: grass tufts and small blossoms */
    ctx.fillStyle='#3f8f3a';
    for(x=-mod(off,10);x<W;x+=10){ ctx.fillRect(x,GROUND_Y+2,2,4); ctx.fillRect(x+3,GROUND_Y+1,2,5); }
    ctx.fillStyle='#ff9ac4';
    for(x=-mod(off,48);x<W;x+=48){ ctx.fillRect(x+6,GROUND_Y+8,3,3); }
    ctx.fillStyle='#fff3a0';
    for(x=-mod(off,48)+30;x<W;x+=48){ ctx.fillRect(x,GROUND_Y+10,2,2); }
  } else if(s===1){ /* summer: sand ripples */
    ctx.fillStyle='rgba(255,236,190,0.35)';
    for(var y=GROUND_Y+18;y<H;y+=14){
      for(x=-mod(off,30);x<W;x+=30){ ctx.fillRect(x,y,14,1); }
    }
  } else if(s===2){ /* autumn: fallen leaves on the path */
    for(var i=0;i<14;i++){
      var lx=mod(i*37-off,W), ly=GROUND_Y+4+(i*11)%20;
      ctx.fillStyle=LEAVES[i%3];
      ctx.fillRect(lx,ly,3,2);
    }
  } else { /* winter: snow bumps on the surface and an ice shine */
    ctx.fillStyle='#ffffff';
    for(x=-mod(off,16);x<W;x+=16){
      ctx.beginPath(); ctx.arc(x+8,GROUND_Y+2,7,Math.PI,0); ctx.fill();
    }
    ctx.fillStyle='#bfe9ff';
    ctx.fillRect(0,GROUND_Y+14,W,1);
  }
}
function drawGround(){
  ctx.fillStyle=rgb(PAL.groundDark,1);
  ctx.fillRect(0,GROUND_Y,W,GROUND_H);
  ctx.fillStyle=rgb(PAL.ground,1);
  ctx.fillRect(0,GROUND_Y,W,10);
  for(var s=0;s<4;s++){
    var w=sw(s);
    if(w<0.01) continue;
    ctx.globalAlpha=w;
    groundDecor(s);
    ctx.globalAlpha=1;
  }
  ctx.save();
  ctx.shadowColor=rgb(PAL.rim,1);
  ctx.shadowBlur=10;
  ctx.fillStyle=rgb(PAL.rim,1);
  ctx.fillRect(0,GROUND_Y,W,2);
  ctx.restore();
}

/* ---------- pillars: each season has its own design ---------- */
function drawShaft(x,y,h,capAtBottom,seed,season){
  if(h<=0) return;
  var P=PILLAR[season];
  var g=ctx.createLinearGradient(x,0,x+GATE_W,0);
  g.addColorStop(0,P.s0); g.addColorStop(0.5,P.s1); g.addColorStop(1,P.s2);
  ctx.fillStyle=g;
  ctx.fillRect(x+6,y,GATE_W-12,h);

  ctx.save();
  ctx.beginPath(); ctx.rect(x+6,y,GATE_W-12,h); ctx.clip();
  var k;
  if(season===0){ /* blossom-green: mossy stone with pink blossom clusters */
    ctx.fillStyle=P.band; ctx.globalAlpha=0.35;
    for(k=0;k<6;k++){ ctx.fillRect(x+6,y+((seed*23+k*41)%Math.max(1,h-6)),GATE_W-12,2); }
    ctx.globalAlpha=1;
    for(k=0;k<9;k++){
      var bcy=y+8+((seed*37+k*61)%Math.max(1,h-16));
      var bcx=x+10+((k*17+Math.floor(seed*7))%(GATE_W-20));
      ctx.fillStyle=P.blossom[k%3];
      ctx.beginPath(); ctx.arc(bcx,bcy,2.6,0,Math.PI*2); ctx.fill();
    }
  } else if(season===1){ /* sandstone and terracotta: carved bands */
    ctx.fillStyle=P.band; ctx.globalAlpha=0.4;
    for(k=0;k<8;k++){ ctx.fillRect(x+6,y+((seed*19+k*26)%Math.max(1,h-4)),GATE_W-12,2); }
    ctx.globalAlpha=1;
    ctx.fillStyle='rgba(255,240,200,0.5)';
    ctx.fillRect(x+12,y,2,h);
  } else if(season===2){ /* bare autumn trunk: bark grooves */
    ctx.fillStyle=P.bark; ctx.globalAlpha=0.6;
    ctx.fillRect(x+12+(seed%3),y,1,h);
    ctx.fillRect(x+24+((seed*2)%3),y,1,h);
    ctx.fillRect(x+36,y,1,h);
    ctx.globalAlpha=1;
    ctx.fillStyle='rgba(255,176,90,0.25)';
    ctx.fillRect(x+30,y,4,h);
  } else { /* winter ice: translucent blue with streaks */
    ctx.fillStyle='rgba(255,255,255,0.45)';
    ctx.fillRect(x+14,y,2,h);
    ctx.fillRect(x+30,y+((seed*13)%20),1,h*0.6);
    ctx.fillStyle='rgba(200,240,255,0.5)';
    for(k=0;k<4;k++){ ctx.fillRect(x+8+k*10,y+((seed*29+k*50)%Math.max(1,h-10)),1,8); }
  }
  ctx.restore();

  /* bare branches stick out from autumn trunks, outside the clip */
  if(season===2){
    ctx.strokeStyle=P.bark; ctx.lineWidth=3;
    for(var b=0;b*46<h-20;b++){
      var yy=y+18+b*46;
      ctx.beginPath();
      ctx.moveTo(x+GATE_W-6,yy); ctx.lineTo(x+GATE_W+7,yy-7);
      ctx.moveTo(x+6,yy+10); ctx.lineTo(x-5,yy+3);
      ctx.stroke();
    }
  }

  /* cap at the gap side */
  var py = capAtBottom ? y+h-CAP_H : y;
  if(season===0){
    ctx.fillStyle=P.cap;
    ctx.fillRect(x-4,py,GATE_W+8,CAP_H);
    for(k=0;k<6;k++){
      ctx.fillStyle=P.blossom[k%3];
      ctx.beginPath(); ctx.arc(x+2+k*9.2,py+(capAtBottom?CAP_H-3:3),3,0,Math.PI*2); ctx.fill();
    }
  } else if(season===1){
    ctx.fillStyle=P.cap;
    ctx.fillRect(x-4,py,GATE_W+8,CAP_H);
    ctx.fillStyle=P.band; ctx.globalAlpha=0.5;
    for(k=0;k<9;k++){ ctx.fillRect(x-4+k*8,py+(capAtBottom?0:CAP_H-3),4,3); }
    ctx.globalAlpha=1;
  } else if(season===2){
    ctx.fillStyle=P.cap;
    ctx.fillRect(x-4,py,GATE_W+8,CAP_H);
    for(k=0;k<6;k++){
      ctx.fillStyle=P.leaves[k%3];
      ctx.beginPath(); ctx.arc(x+2+k*9,py+(capAtBottom?CAP_H:0),5,0,Math.PI*2); ctx.fill();
    }
  } else {
    /* ice cap with icicles hanging into the gap, glowing frost */
    ctx.save();
    ctx.shadowColor=P.glow; ctx.shadowBlur=10;
    ctx.fillStyle=P.cap;
    ctx.fillRect(x-4,py,GATE_W+8,CAP_H);
    ctx.restore();
    for(k=0;k<5;k++){
      var xi=x+4+k*((GATE_W-8)/4);
      var len=6+((seed*13+k*7)%7);
      ctx.fillStyle=P.icicle;
      ctx.beginPath();
      if(capAtBottom){
        ctx.moveTo(xi-3,py+CAP_H); ctx.lineTo(xi+3,py+CAP_H); ctx.lineTo(xi,py+CAP_H+len);
      } else {
        ctx.moveTo(xi-3,py); ctx.lineTo(xi+3,py); ctx.lineTo(xi,py-len);
      }
      ctx.closePath(); ctx.fill();
    }
  }

  /* edge rims in the season color */
  ctx.globalAlpha=0.6;
  ctx.fillStyle=P.rimc;
  ctx.fillRect(x+6,y,1,h);
  ctx.fillRect(x+GATE_W-7,y,1,h);
  ctx.globalAlpha=1;

  /* at night the pillars dim */
  if(NIGHT>0.01){
    ctx.fillStyle='rgba(10,14,40,'+(0.42*NIGHT).toFixed(3)+')';
    ctx.fillRect(x-4,y,GATE_W+8,h);
  }
}
function drawGate(p){
  var gy=p.top+p.gap;
  drawShaft(p.x, 0, p.top, true, p.seed, p.season);
  drawShaft(p.x, gy, GROUND_Y-gy, false, p.seed+0.5, p.season);
}
function gapFor(){
  /* 1-19: wide, gentle gaps. after each 20-point mark: gaps shrink ~6px per zone (floor 92) */
  if(zoneN===0) return Math.max(88, 124-TIER_GAP_CUT[tier])+Math.floor(Math.random()*7);
  var base=Math.max(92, 124-6*zoneN);
  base=Math.max(88, base-TIER_GAP_CUT[tier]);
  return base+Math.floor(Math.random()*5);
}
function zoneSpeedMult(z){
  /* 1-19: gentle slope up to +3%. each zone after the first: +8%, and each full 4-season cycle: +10% more */
  if(z===0) return 1+0.03*clamp(score/(ZONE_PTS-1),0,1);
  return Math.min(2.2,(1+0.08*z)*(1+0.10*Math.floor(z/4)));
}
function speedNow(){
  /* the speed step eases in with the crossfade so the 20-point mark never jolts the pace */
  var t=BLEND;
  var a=zoneSpeedMult(zoneFrom), b=zoneSpeedMult(zoneN);
  return SPEED*(a+(b-a)*t)*TIER_SPEED[tier];
}
function addGate(x){
  var gap=gapFor();
  var minTop=70, maxTop=GROUND_Y-70-gap;
  var p={x:x, gap:gap, top:Math.floor(minTop+Math.random()*(maxTop-minTop)), passed:false, item:null, seed:Math.random()*10, season:zoneN%4};
  if(score>=2 && Math.random()<TIER_ITEM_CHANCE[tier]){
    p.item={type:'shield', taken:false};
  }
  gates.push(p);
}
/* shield orb sits in the middle of the gap, colored by its season */
function drawItem(p){
  if(!p.item || p.item.taken) return;
  var cx=p.x+GATE_W/2, cy=p.top+p.gap/2;
  var pulse=Math.sin(frames*0.12)*1.5;
  var col=PILLAR[p.season].rimc;
  ctx.save();
  ctx.shadowColor=col;
  ctx.shadowBlur=12;
  ctx.fillStyle=COL.K;
  ctx.beginPath(); ctx.arc(cx,cy,9+pulse,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=col;
  ctx.beginPath(); ctx.arc(cx,cy,7+pulse,0,Math.PI*2); ctx.fill();
  ctx.restore();
  txt('S', cx, cy, 11, '#ffffff');
}

/* ---------- bird ---------- */
function drawBird(){
  var cx=bird.x+BIRD_W/2, cy=bird.y+BIRD_H/2;
  var ang = (state==='ready') ? 0 : clamp(bird.vy*0.06, -0.45, 0.9);
  var blink = invuln>0 && Math.floor(frames/4)%2===0;
  ctx.save();
  ctx.translate(Math.round(cx),Math.round(cy));
  ctx.rotate(ang);
  ctx.translate(-BIRD_W/2,-BIRD_H/2);
  if(blink) ctx.globalAlpha=0.35;
  /* thruster glow: faint at rest, bright on each flap, tinted by the season */
  var pulse = flapT>0 ? 1 : 0.35;
  var tr = flapT>0 ? 14 : 8;
  var tg=ctx.createRadialGradient(12,BIRD_H+3,0,12,BIRD_H+3,tr);
  tg.addColorStop(0,rgb(PAL.rim,0.55*pulse));
  tg.addColorStop(0.45,rgb(PAL.glow,0.25*pulse));
  tg.addColorStop(1,rgb(PAL.glow,0));
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  ctx.fillStyle=tg;
  ctx.fillRect(-4,BIRD_H-10,32,26);
  ctx.restore();
  for(var r=0;r<ROBOT.length;r++){
    var row = (r===8 && flapT>0) ? ROW_FLAP : ROBOT[r];
    for(var c=0;c<row.length;c++){
      var ch=row[c];
      if(ch==='.') continue;
      ctx.fillStyle=COL[ch];
      ctx.fillRect(c*2, r*2, 2, 2);
    }
  }
  if(flapT>0){
    /* jet puffs under the feet, flicker each frame */
    for(var k=0;k<3;k++){
      ctx.fillStyle=((k+Math.floor(frames))%2) ? '#ffb347' : '#ffe27a';
      ctx.fillRect(7+k*4, BIRD_H+1+(k%2)*2, 2, 2);
    }
  }
  ctx.restore();
  if(shield){
    ctx.strokeStyle=rgb(PAL.rim,1);
    ctx.lineWidth=2;
    ctx.globalAlpha=0.85;
    ctx.beginPath();
    ctx.arc(cx,cy,17+Math.sin(frames*0.2),0,Math.PI*2);
    ctx.stroke();
    ctx.globalAlpha=1;
  }
}

/* ---------- text ---------- */
function txt(s,x,y,size,color){
  ctx.font='bold '+size+'px "Courier New", Courier, monospace';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.lineJoin='round';
  ctx.lineWidth=Math.max(3,Math.round(size/6));
  ctx.strokeStyle=COL.K;
  ctx.strokeText(s,x,y);
  ctx.fillStyle=color;
  ctx.fillText(s,x,y);
}
/* small HUD tag, returns its width */
function hudTag(s,x,y,color,right){

/* subtle tier label under the score */
function drawTierLabel(){

/* big banner flash when the tier steps up */
function drawTierBanner(){

/* ---------- audio: generative ambient pad + soft SFX (WebAudio, no files) ---------- */
var ac=null, master=null, ambBus=null, sfxBus=null, noiseBuf=null, ambTimer=null, lfoGain=null;
function ensureAudio(){
  if(ac){ if(ac.state==='suspended' && ac.resume) ac.resume(); return ac; }
  var AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return null;
  try{ ac=new AC(); }catch(e){ ac=null; return null; }
  master=ac.createGain();
  master.gain.value=(muted||paused)?0:1;
  master.connect(ac.destination);
  ambBus=ac.createGain(); ambBus.gain.value=0.042;
  sfxBus=ac.createGain(); sfxBus.gain.value=0.33;
  /* soft echo shared by pad and sfx */
  var dl=ac.createDelay(1.0); dl.delayTime.value=0.41;
  var fb=ac.createGain(); fb.gain.value=0.3;
  var wet=ac.createGain(); wet.gain.value=0.22;
  dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(master);
  ambBus.connect(master); ambBus.connect(dl);
  sfxBus.connect(master); sfxBus.connect(dl);
  /* slow filter sweep LFO, shared by all pad filters */
  var lfo=ac.createOscillator(); lfo.frequency.value=0.05;
  lfoGain=ac.createGain(); lfoGain.gain.value=200;
  lfo.connect(lfoGain); lfo.start();
  /* one second of white noise for whooshes */
  noiseBuf=ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  var nd=noiseBuf.getChannelData(0);
  for(var i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
  startAmbient();
  return ac;
}
function mtof(m){ return 440*Math.pow(2,(m-69)/12); }
/* each season has its own chord loop: spring light, summer warm, autumn mellow, winter quiet and crisp */
var chordIdx=0;
function playChord(t0){
  var M=SEASON_MUSIC[zoneN%4];
  var ch=M.chords[chordIdx%M.chords.length];
  chordIdx++;
  var dur=9;
  var lp=ac.createBiquadFilter();
  lp.type='lowpass'; lp.frequency.value=M.lp; lp.Q.value=0.4;
  lfoGain.connect(lp.frequency);
  lp.connect(ambBus);
  ch.forEach(function(m,vi){
    var f=mtof(m);
    var g=ac.createGain();
    var peak=0.11/ch.length*2*M.gain;
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(peak,t0+3);
    g.gain.setValueAtTime(peak,t0+dur-3);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur+1.5);
    g.connect(lp);
    var o=ac.createOscillator(); o.type='sine'; o.frequency.value=f; o.detune.value=(vi-1.5)*4;
    var o2=ac.createOscillator(); o2.type='triangle'; o2.frequency.value=f; o2.detune.value=-7+vi*2.5;
    var o2g=ac.createGain(); o2g.gain.value=0.35;
    o.connect(g); o2.connect(o2g); o2g.connect(g);
    o.start(t0); o2.start(t0);
    o.stop(t0+dur+2); o2.stop(t0+dur+2);
  });
  /* occasional bell on top of the chord */
  if(Math.random()<0.6){
    var bt=t0+2+Math.random()*4;
    var bo=ac.createOscillator(); bo.type='sine'; bo.frequency.value=mtof(ch[3]+12);
    var bg=ac.createGain();
    bg.gain.setValueAtTime(0.0001,bt);
    bg.gain.exponentialRampToValueAtTime(0.05*M.gain,bt+0.6);
    bg.gain.exponentialRampToValueAtTime(0.0001,bt+4);
    bo.connect(bg); bg.connect(ambBus);
    bo.start(bt); bo.stop(bt+4.2);
  }
}
function startAmbient(){
  if(ambTimer) return;
  function next(){
    if(!ac) return;
    playChord(ac.currentTime+0.05);
    ambTimer=setTimeout(next, 8000);
  }
  next();
}
function toggleMute(){
  muted=!muted;
  try{ localStorage.setItem(MUTE_KEY, muted?'1':'0'); }catch(e){}
  if(master && ac) master.gain.setTargetAtTime((muted||paused)?0:1, ac.currentTime, 0.05);
}
/* soft chime (point, shield pickup) */
function chime(f,vol){
  if(!ac) return;
  var t=ac.currentTime;
  [f, f*1.5].forEach(function(ff,i){
    var o=ac.createOscillator(); o.type='sine'; o.frequency.value=ff;
    var g=ac.createGain();
    var v=(vol||0.1)*(i?0.4:1);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(v,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.9);
    o.connect(g); g.connect(sfxBus);
    o.start(t); o.stop(t+1);
  });
}
/* muffled thud (hit) */
function thud(){
  if(!ac) return;
  var t=ac.currentTime;
  var o=ac.createOscillator(); o.type='triangle';
  o.frequency.setValueAtTime(150,t);
  o.frequency.exponentialRampToValueAtTime(45,t+0.3);
  var lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=380;
  var g=ac.createGain();
  g.gain.setValueAtTime(0.5,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.4);
  o.connect(lp); lp.connect(g); g.connect(sfxBus);
  o.start(t); o.stop(t+0.45);
}
/* soft whoosh (flap) */
function whoosh(){
  if(!ac||!noiseBuf) return;
  var t=ac.currentTime;
  var src=ac.createBufferSource(); src.buffer=noiseBuf;
  var bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.2;
  bp.frequency.setValueAtTime(350,t);
  bp.frequency.exponentialRampToValueAtTime(1300,t+0.22);
  var g=ac.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.22,t+0.04);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.25);
  src.connect(bp); bp.connect(g); g.connect(sfxBus);
  src.start(t, Math.random()*0.5); src.stop(t+0.3);
}

/* ---------- game logic ---------- */
/* tier only moves up within a run (score only rises); fires a banner and a chime on the step */
function checkTier(){
  var nt=0;
  for(var k=1;k<TIER_PTS.length;k++){ if(score>=TIER_PTS[k]) nt=k; }
  if(nt!==tier){
    tier=nt;
    tierBanner={text:TIER_NAMES[tier], t:150};
    chime(660+tier*220,0.12);
  }
}
function reset(){
  bird={x:BIRD_X, y:H/2-80, vy:0};
  gates=[];
  score=0; tier=0; tierBanner={text:'',t:0};
  newBest=false;
  shake=0; flash=0;
  shield=false; invuln=0; flapT=0;
  zoneN=0; zoneFrom=0; blendF=1;
}
function startRun(){ /* no per-run extras: the season cycle carries the mood */ }
function flapNow(){
  bird.vy=FLAP;
  flapT=12;
  whoosh();
}
function die(){
  if(state!=='play') return;
  state='dead';
  deadAt=frames;
  shake=10;
  flash=1;
  thud();
  if(score>best){
    best=score;
    newBest=true;
    storeBest(best);
  }
}
/* returns true if the bird should die now; the shield eats one hit and grants brief invulnerability */
function hitBird(){
  if(invuln>0) return false;
  if(shield){
    shield=false;
    invuln=INVULN_FRAMES;
    flash=0.5;
    shake=4;
    chime(880,0.12);
    return false;
  }
  return true;
}
/* the season starts crossfading to the next; blendF eases in over ZONE_BLEND_FRAMES */
function beginZoneBlend(){
  zoneFrom=zoneN; zoneN++; blendF=0;
}
function action(){
  ensureAudio();
  if(state==='ready'){ startRun(); state='play'; flapNow(); }
  else if(state==='play'){ flapNow(); }
  else if(state==='dead' && frames-deadAt>35){ reset(); startRun(); state='play'; flapNow(); }
}
function overlap(ax,ay,aw,ah,bx,by,bw,bh){
  return ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by;
}

function update(f0){
  frames+=f0;
  var f=f0;
  visScore+=(score-visScore)*Math.min(1,0.05*f0);
  if(blendF<1) blendF=Math.min(1,blendF+f0/ZONE_BLEND_FRAMES);
  computePal();
  updateParts(f0);
  hillOff+=0.35*f;
  groundOff+=speedNow()*f;
  if(shake>0) shake=Math.max(0,shake-0.6*f0);
  if(flash>0) flash=Math.max(0,flash-0.05*f0);
  if(tierBanner.t>0) tierBanner.t=Math.max(0,tierBanner.t-f0);

  if(state==='ready'){
    bird.vy=0;
    bird.y=H/2-80+Math.sin(frames*0.08)*6;
    return;
  }

  if(state==='play'){
    if(invuln>0) invuln=Math.max(0,invuln-f0);
    if(flapT>0) flapT=Math.max(0,flapT-f0);

    bird.vy=Math.min(MAX_FALL,bird.vy+GRAV*f);
    bird.y+=bird.vy*f;
    if(bird.y<0){ bird.y=0; bird.vy=0; }

    var spd=speedNow()*f;
    for(var i=0;i<gates.length;i++) gates[i].x-=spd;
    if(!gates.length || gates[gates.length-1].x < W-SPACING) addGate(W+20);
    while(gates.length && gates[0].x+GATE_W < -10) gates.shift();

    var hx=bird.x+3, hy=bird.y+3, hw=BIRD_W-6, hh=BIRD_H-6;
    for(var j=0;j<gates.length;j++){
      var p=gates[j];
      if(!p.passed && p.x+GATE_W < BIRD_X){
        p.passed=true;
        score++;
        chime(1318,0.09);
        checkTier();
        if(score>0 && score%ZONE_PTS===0){ beginZoneBlend(); }
      }
      if(p.item && !p.item.taken){
        var ix=p.x+GATE_W/2-ITEM_SIZE/2, iy=p.top+p.gap/2-ITEM_SIZE/2;
        if(overlap(hx,hy,hw,hh,ix,iy,ITEM_SIZE,ITEM_SIZE)){
          p.item.taken=true;
          shield=true; chime(988,0.1);
        }
      }
      var gy=p.top+p.gap;
      if(overlap(hx,hy,hw,hh,p.x,0,GATE_W,p.top) ||
         overlap(hx,hy,hw,hh,p.x,gy,GATE_W,GROUND_Y-gy)){
        if(hitBird()){ die(); return; }
      }
    }
    if(bird.y+BIRD_H>=GROUND_Y){
      bird.y=GROUND_Y-BIRD_H;
      if(hitBird()){ die(); }
      else { bird.vy=FLAP*0.6; }
    }
    return;
  }

  if(state==='dead'){
    bird.vy=Math.min(MAX_FALL,bird.vy+GRAV*f);
    bird.y+=bird.vy*f;
    if(bird.y+BIRD_H>=GROUND_Y){ bird.y=GROUND_Y-BIRD_H; bird.vy=0; }
  }
}

/* ---------- rendering ---------- */
function drawScore(){
  txt(String(score), W/2, 60, 40, '#ffffff');
}
function drawTitle(){
  txt('PRIME', W/2, 150, 44, '#ffffff');
  txt('EARTH SEASONS', W/2, 192, 26, '#d6f5a8');
  txt('robot warrior, four seasons', W/2, 230, 12, '#ffffff');
  txt('spring summer autumn winter', W/2, 250, 10, '#ffffff');
  if(Math.floor(frames/30)%2===0) txt('tap or space to flap', W/2, 300, 15, '#ffffff');
  txt('BEST '+best, W/2, 340, 16, '#ffe27a');
}
function drawGameOver(){
  ctx.fillStyle=COL.K;
  ctx.fillRect(W/2-112,130,224,232);
  ctx.fillStyle='#fff4d6';
  ctx.fillRect(W/2-108,134,216,224);
  txt('GAME OVER', W/2, 172, 26, '#e03a3a');
  txt('SCORE', W/2, 214, 14, '#14142b');
  txt(String(score), W/2, 240, 30, '#14142b');
  txt('BEST', W/2, 276, 14, '#14142b');
  txt(String(best), W/2, 300, 26, '#14142b');
  if(newBest && Math.floor(frames/20)%2===0) txt('NEW BEST!', W/2, 330, 16, '#e03a3a');
  if(frames-deadAt>35 && Math.floor(frames/25)%2===0) txt('tap or space to retry', W/2, 390, 15, '#ffffff');
}
function render(){
  ctx.save();
  if(shake>0.5){
    ctx.translate(Math.round((Math.random()*2-1)*shake), Math.round((Math.random()*2-1)*shake));
  }
  drawSky();
  drawBodies();
  drawStars();
  drawHills();
  drawHeat();
  drawParts();
  for(var i=0;i<gates.length;i++) drawGate(gates[i]);
  for(var j=0;j<gates.length;j++) drawItem(gates[j]);
  drawGround();
  drawBird();
  ctx.restore();

  if(flash>0){
    ctx.fillStyle='rgba(255,255,255,'+(flash*0.7).toFixed(3)+')';
    ctx.fillRect(0,0,W,H);
  }
  if(state==='play'){
    drawScore();
    drawHUD();
    drawTierBanner();
  }
  else if(state==='ready') drawTitle();
  else if(state==='dead') drawGameOver();
  drawMuteBtn();
  drawChrome();
}

/* ---------- mute button (canvas-drawn, top-right) ---------- */
function drawMuteBtn(){
  var b=MUTE_BOX;
  ctx.fillStyle='rgba(8,20,14,0.7)';
  ctx.fillRect(b.x,b.y,b.w,b.h);
  var col = muted ? '#ff7a7a' : '#ffffff';
  ctx.strokeStyle=col;
  ctx.lineWidth=1;
  ctx.strokeRect(b.x+0.5,b.y+0.5,b.w-1,b.h-1);
  var cx=b.x+6, cy=b.y+b.h/2;
  ctx.fillStyle = col;
  ctx.fillRect(cx-2,cy-2,3,4);
  ctx.beginPath();
  ctx.moveTo(cx+1,cy-2); ctx.lineTo(cx+5,cy-5); ctx.lineTo(cx+5,cy+5); ctx.lineTo(cx+1,cy+2);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = col;
  ctx.beginPath();
  if(!muted){
    ctx.arc(cx+5,cy,4,-0.8,0.8);
    ctx.moveTo(cx+9,cy); ctx.arc(cx+5,cy,8,-0.8,0.8);
  } else {
    ctx.moveTo(cx+8,cy-4); ctx.lineTo(cx+14,cy+4);
    ctx.moveTo(cx+14,cy-4); ctx.lineTo(cx+8,cy+4);
  }
  ctx.stroke();
}

/* ---------- top-left chrome: back to hub, pause/resume ---------- */
var BACK_BOX={x:8,y:8,w:30,h:30}, PAUSE_BOX={x:50,y:8,w:30,h:30};
function setPaused(p){
  paused=p;
  if(master && ac) master.gain.setTargetAtTime((muted||paused)?0:1, ac.currentTime, 0.05);
}
function togglePause(){
  if(state!=='play' && !paused) return;
  setPaused(!paused);
}
function gamePt(e){
  var r=cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)*W/r.width, y:(e.clientY-r.top)*H/r.height};
}
function inBox(p,b){ return p.x>=b.x-6 && p.x<=b.x+b.w+6 && p.y>=b.y-6 && p.y<=b.y+b.h+6; }
/* returns true when the tap was used by the chrome (back, pause, or tap-to-resume) */
function handleChrome(e){
  var p=gamePt(e);
  if(inBox(p,BACK_BOX)){ location.href=BACK_URL; return true; }
  if(inBox(p,PAUSE_BOX) && (state==='play' || paused)){ ensureAudio(); togglePause(); return true; }
  if(paused && !inBox(p,MUTE_BOX)){ setPaused(false); return true; }
  return false;
}
function drawChromeBox(b){
  ctx.fillStyle='rgba(8,20,14,0.7)';
  ctx.fillRect(b.x,b.y,b.w,b.h);
  ctx.strokeStyle='#ffffff'; ctx.lineWidth=1;
  ctx.strokeRect(b.x+0.5,b.y+0.5,b.w-1,b.h-1);
}
function drawChrome(){
  var b=BACK_BOX, cx=b.x+b.w/2, cy=b.y+b.h/2;
  drawChromeBox(b);
  ctx.strokeStyle='#ffffff'; ctx.lineWidth=2; ctx.beginPath();
  ctx.moveTo(cx+4,cy-7); ctx.lineTo(cx-4,cy); ctx.lineTo(cx+4,cy+7); ctx.stroke();
  if(state==='play' || paused){
    var q=PAUSE_BOX, px=q.x+q.w/2, py=q.y+q.h/2;
    drawChromeBox(q);
    ctx.fillStyle='#ffffff';
    if(paused){
      ctx.beginPath(); ctx.moveTo(px-3,py-6); ctx.lineTo(px+6,py); ctx.lineTo(px-3,py+6); ctx.closePath(); ctx.fill();
    } else {
      ctx.fillRect(px-5,py-6,3,12); ctx.fillRect(px+2,py-6,3,12);
    }
  }
  if(paused){
    ctx.fillStyle='rgba(8,20,14,0.45)';
    ctx.fillRect(0,0,W,H);
    txt('PAUSED', W/2, H/2-14, 30, '#ffffff');
    txt('tap to resume', W/2, H/2+22, 14, '#d6f5a8');
  }
}

/* ---------- input ---------- */
function inMuteBox(e){
  var r=cv.getBoundingClientRect();
  var x=(e.clientX-r.left)*W/r.width, y=(e.clientY-r.top)*H/r.height;
  var b=MUTE_BOX;
  return x>=b.x-4 && x<=b.x+b.w+4 && y>=b.y-4 && y<=b.y+b.h+4;
}
window.addEventListener('pointerdown', function(e){
  if(e.preventDefault) e.preventDefault();
  if(handleChrome(e)) return;
  if(inMuteBox(e)){ toggleMute(); return; }
  action();
}, {passive:false});
window.addEventListener('touchstart', function(e){
  if(e.cancelable) e.preventDefault();
}, {passive:false});
window.addEventListener('touchmove', function(e){
  if(e.cancelable) e.preventDefault();
}, {passive:false});
window.addEventListener('keydown', function(e){
  if(e.code==='KeyP' && !e.repeat){ togglePause(); return; }
  if(paused){
    if(e.code==='Space' || e.code==='Enter' || e.code==='ArrowUp'){
      if(e.preventDefault) e.preventDefault();
      if(!e.repeat) setPaused(false);
    } else if(e.code==='KeyM' && !e.repeat){ ensureAudio(); toggleMute(); }
    return;
  }
  if(e.code==='KeyM' && !e.repeat){ toggleMute(); return; }
  if(e.code==='Space' || e.code==='ArrowUp' || e.code==='Enter'){
    if(e.preventDefault) e.preventDefault();
    if(!e.repeat) action();
  }
});
window.addEventListener('contextmenu', function(e){ e.preventDefault(); });

/* ---------- init ---------- */
for(var pk=0;pk<PARTS.length;pk++){ PARTS[pk].y=Math.random()*GROUND_Y; }
reset();
computePal();

/* ---------- loop ---------- */
var lastT=null;
function loop(t){
  var dt=(lastT===null)?16.667:(t-lastT);
  lastT=t;
  if(!(dt>0)) dt=16.667;
  dt=Math.min(dt,50);
  var f=dt/(1000/60);
  if(!paused) update(f);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
