<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Prime Run</title>
<style>
  html,body{margin:0;height:100%;background:#0b1a12;overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  canvas{display:block;background:#0b1a12;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;}
</style>
</head>
<body>
<canvas id="game" width="640" height="300"></canvas>
<script>
(function(){
'use strict';

/* Prime Run. Single-file endless runner, no dependencies.
   Prime auto-runs. Tap or space jumps, down arrow or swipe down slides under overhead branches and icicles.
   Four seasons (spring, summer, autumn, winter) cycle every 200 points with a slow crossfade.
   Day and night drift on a 60 second cycle. Score is distance. Best score lives in localStorage. */

var W=640, H=300, GROUND_H=60, GROUND_Y=H-GROUND_H;
var P=3;                              /* pixel size of the Prime sprite */
var PX=84;                            /* Prime's x position */
var GRAV=0.62, JUMP=11.4, FAST_FALL=2.4;
var SPEED0=5.6, SPEED_MAX=13.5, SPEED_RAMP=0.0012;
var DIST_PER_PT=40, ZONE_PTS=200, ZONE_BLEND_FRAMES=480, DAY_LEN=3600;
var AIR_Y=GROUND_Y-44, AIR_H=22;     /* overhead band: hits a standing or jumping Prime, misses a slide */
var KEY='primeRunnerBest';
var MUTE_KEY='primeRunnerMuted';
var MUTE_BOX={x:W-30,y:8,w:22,h:22};
var SEASON_NAMES=['SPRING','SUMMER','AUTUMN','WINTER'];

var cv=document.getElementById('game');
var ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;

function fit(){
  var s=Math.max(0.5,Math.min(window.innerWidth/W,window.innerHeight/H));
  cv.style.width=Math.floor(W*s)+'px';
  cv.style.height=Math.floor(H*s)+'px';
}
window.addEventListener('resize',fit);
fit();

var best=0;
try{ best=parseInt(localStorage.getItem(KEY),10)||0; }catch(e){}
function storeBest(v){ try{ localStorage.setItem(KEY,String(v)); }catch(e){} }

var muted=false;
try{ muted=localStorage.getItem(MUTE_KEY)==='1'; }catch(e){}

function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function smooth01(t){ t=clamp(t,0,1); return t*t*(3-2*t); }
function lerpC(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
function rgb(c,a){
  return 'rgba('+Math.round(c[0])+','+Math.round(c[1])+','+Math.round(c[2])+','+(a===undefined?1:a).toFixed(3)+')';
}
function mod(a,n){ return ((a%n)+n)%n; }

var COL={K:'#14142b',B:'#2f6fe0',R:'#e03a3a',W:'#ffffff',C:'#7ff3ff'};
/* same red/blue Prime robot as the flappy game. rows 0-8 are the body, 3-8 the slide pose */
var ROBOT=[
  "....KKKK....",
  "...KBBBBK...",
  "..KBBBBBBK..",
  "..KWWBBWWK..",
  "..KCWBBWCK..",
  "..KKKKKKKK..",
  ".KRRRRRRRRK.",
  "KRRRRRRRRRRK",
  "KRRKRRRRKRRK",
  ".KRRRRRRRRK.",
  "..KK....KK.."
];

/* ---------- seasons: day and night palettes (rgb arrays so they can be blended) ---------- */
var PAL_DAY=[
  { top:[136,206,250], mid:[196,236,255], bot:[222,246,204],
    hillFar:[164,222,156], hillNear:[104,192,98], ground:[120,190,84], groundDark:[78,136,56],
    rim:[255,160,200], glow:[255,190,220], body:[255,246,206] },
  { top:[255,190,96], mid:[255,224,150], bot:[246,166,94],
    hillFar:[236,192,124], hillNear:[218,156,96], ground:[226,176,110], groundDark:[170,114,66],
    rim:[255,200,90], glow:[255,190,80], body:[255,222,90] },
  { top:[242,160,76], mid:[252,202,122], bot:[232,132,66],
    hillFar:[206,132,72], hillNear:[170,98,50], ground:[150,92,44], groundDark:[94,54,28],
    rim:[255,178,70], glow:[255,150,60], body:[255,176,82] },
  { top:[180,214,242], mid:[222,238,250], bot:[244,249,255],
    hillFar:[208,226,240], hillNear:[238,246,252], ground:[246,250,255], groundDark:[196,216,236],
    rim:[150,226,255], glow:[160,220,255], body:[250,252,255] }
];
var PAL_NIGHT=[
  { top:[16,30,64], mid:[34,62,98], bot:[50,90,104],
    hillFar:[30,60,70], hillNear:[22,50,50], ground:[30,70,46], groundDark:[14,40,28],
    rim:[210,160,220], glow:[160,160,220], body:[226,236,255] },
  { top:[40,18,44], mid:[96,44,66], bot:[150,72,58],
    hillFar:[80,44,52], hillNear:[60,34,40], ground:[108,58,40], groundDark:[64,32,24],
    rim:[255,150,90], glow:[220,120,90], body:[238,226,220] },
  { top:[44,22,36], mid:[92,42,44], bot:[126,62,40],
    hillFar:[72,40,40], hillNear:[52,28,30], ground:[80,44,30], groundDark:[46,24,18],
    rim:[230,140,70], glow:[200,110,60], body:[238,214,180] },
  { top:[12,24,48], mid:[30,50,86], bot:[60,84,120],
    hillFar:[52,70,100], hillNear:[120,140,170], ground:[170,190,215], groundDark:[100,120,150],
    rim:[120,210,255], glow:[120,190,240], body:[210,226,255] }
];
/* season accents for the pillars of the sky: trees, mesas, pines and their ground colours */
var TREE=[
  { trunk:'#6b4a2a', c1:'#ffb3d1', c2:'#ff8fbf', c3:'#ffd6e6' },
  { rock1:'#c97a48', rock2:'#a8603a', cap:'#e8a46a' },
  { trunk:'#4a2f1a', c1:'#ff8c2a', c2:'#e25c1a', c3:'#ffb84d' },
  { pine:'#3f6e7a', snow:'#ffffff' }
];
var LEAVES=['#ff8c2a','#c2491a','#ffb84d','#d9542a'];
/* music per season: chord loops, filter brightness, level */
var SEASON_MUSIC=[
  { chords:[[60,64,67,72],[57,62,66,71],[53,57,60,64],[55,59,62,67]], lp:1500, gain:1.0 },  /* spring: light, major */
  { chords:[[55,59,62,67],[53,57,60,64],[48,52,55,60],[50,54,57,62]], lp:900,  gain:1.0 },  /* summer: warm, low */
  { chords:[[57,60,64,69],[50,53,57,62],[53,57,60,65],[55,59,62,67]], lp:650,  gain:0.9 },  /* autumn: mellow, minor */
  { chords:[[62,67,71,74],[59,64,67,71],[64,67,71,76],[57,64,67,72]], lp:1800, gain:0.7 }   /* winter: quiet, crisp */
];

/* obstacle sizes per season. ground kinds sit on the path, air kinds hang in the overhead band */
var GROUND_KIND=['log','rock','fallen','boulder'];
var AIR_KIND=['blossom','slab','branch','icicle'];
var GROUND_SIZE={ log:{w:40,h:22}, rock:{w:30,h:34}, fallen:{w:52,h:22}, boulder:{w:36,h:30} };
var AIR_SIZE={ blossom:{w:56}, slab:{w:64}, branch:{w:60}, icicle:{w:44} };

/* ---------- live state ---------- */
var PAL=null, BLEND=1, DAYNESS=1, NIGHT=0, BODY_A=0;
function palFor(s,n){
  var D=PAL_DAY[s], N=PAL_NIGHT[s], o={};
  for(var k in D){ if(D.hasOwnProperty(k)) o[k]=lerpC(D[k],N[k],n); }
  return o;
}
function computePal(){
  BODY_A=Math.PI/2+2*Math.PI*frames/DAY_LEN;
  var sinA=Math.sin(BODY_A);
  DAYNESS=smooth01((sinA+0.35)/0.7);
  NIGHT=1-DAYNESS;
  BLEND=smooth01(blendF);
  var A=palFor(zoneFrom%4,NIGHT), B=palFor(zoneN%4,NIGHT);
  PAL={};
  for(var k in A){ if(A.hasOwnProperty(k)) PAL[k]=lerpC(A[k],B[k],BLEND); }
}
/* how much each season should show right now (fades during the crossfade) */
function sw(s){
  var w=0;
  if(zoneFrom%4===s) w+=1-BLEND;
  if(zoneN%4===s) w+=BLEND;
  return w;
}

var state='ready', frames=0, distance=0, score=0, speed=SPEED0;
var newBest=false, deadAt=0, shake=0;
var player={lift:0, vy:0, onGround:true, anim:0};
var duckHeld=false, duckTouch=false, duckNow=false;
var obs=[], nextGap=0, groundOff=0, hillOff=0, treeOff=0;
var zoneN=0, zoneFrom=0, blendF=1;
var lastMilestone=0;
var pStartY=null;

/* stars and falling particles */
var STARS=[];
for(var si=0;si<40;si++){ STARS.push({x:Math.random()*W, y:Math.random()*(GROUND_Y-40), tw:Math.random()*6}); }
var PARTS=[];
for(var pi=0;pi<30;pi++){
  PARTS.push({ s:pi%4, x:Math.random()*W, y:Math.random()*GROUND_Y, ph:Math.random()*6, c:pi%4, sz:(pi%3)+1 });
}

/* ---------- sky, sun, moon, stars ---------- */
function drawSky(){
  var lg=ctx.createLinearGradient(0,0,0,GROUND_Y);
  lg.addColorStop(0,rgb(PAL.top,1));
  lg.addColorStop(0.6,rgb(PAL.mid,1));
  lg.addColorStop(1,rgb(PAL.bot,1));
  ctx.fillStyle=lg;
  ctx.fillRect(0,0,W,GROUND_Y);
}
function drawBodies(){
  var a=BODY_A;
  var sx=W/2+Math.cos(a)*W*0.42, sy=GROUND_Y-Math.sin(a)*(GROUND_Y-34);
  var mx=W/2+Math.cos(a+Math.PI)*W*0.42, my=GROUND_Y-Math.sin(a+Math.PI)*(GROUND_Y-34);
  var da=DAYNESS, na=NIGHT;
  if(da>0.02){
    ctx.save(); ctx.globalAlpha=da;
    ctx.fillStyle=rgb(PAL.glow,0.25); ctx.beginPath(); ctx.arc(sx,sy,30,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=rgb(PAL.body,1); ctx.beginPath(); ctx.arc(sx,sy,16,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  if(na>0.02){
    ctx.save(); ctx.globalAlpha=na;
    ctx.fillStyle=rgb(PAL.glow,0.2); ctx.beginPath(); ctx.arc(mx,my,22,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=rgb(PAL.body,1); ctx.beginPath(); ctx.arc(mx,my,12,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=rgb(PAL.top,0.55); ctx.beginPath(); ctx.arc(mx+5,my-3,10,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}
function drawStars(){
  if(NIGHT<0.05) return;
  for(var i=0;i<STARS.length;i++){
    var st=STARS[i];
    var tw=0.6+0.4*Math.sin(frames*0.05+st.tw);
    ctx.fillStyle='rgba(255,255,255,'+(NIGHT*tw*0.9).toFixed(3)+')';
    ctx.fillRect(Math.floor(st.x),Math.floor(st.y),2,2);
  }
}

/* ---------- backdrop: parallax hills and season trees ---------- */
function ridge(col, base, amp, off, seed, per){
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.moveTo(0,GROUND_Y);
  for(var x=0;x<=W+6;x+=6){
    var y=base-amp*(0.5+0.5*Math.sin((x+off)*per+seed))-amp*0.3*(0.5+0.5*Math.sin((x+off)*per*2.3+seed*2));
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W,GROUND_Y);
  ctx.closePath();
  ctx.fill();
}
function drawHills(){
  ridge(rgb(PAL.hillFar,1), GROUND_Y-26, 30, hillOff, 0.7, 0.012);
  ridge(rgb(PAL.hillNear,1), GROUND_Y-8, 14, hillOff*1.8, 2.1, 0.02);
}
/* one tree or mesa of a season, its base on the hill line */
function treeAt(s, x, k){
  var base=GROUND_Y-6;
  var h=40+(k%3)*12;
  if(s===0){
    ctx.fillStyle=TREE[0].trunk; ctx.fillRect(x-3,base-h,6,h);
    ctx.fillStyle=TREE[0].c1;
    ctx.beginPath(); ctx.arc(x,base-h-6,22+(k%2)*4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=TREE[0].c2;
    ctx.beginPath(); ctx.arc(x-12,base-h,12,0,Math.PI*2); ctx.arc(x+12,base-h+2,11,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=TREE[0].c3;
    ctx.fillRect(x-8,base-h-16,5,4); ctx.fillRect(x+4,base-h-10,4,3);
  } else if(s===1){
    var mw=70+(k%3)*20;
    ctx.fillStyle=TREE[1].rock1;
    ctx.beginPath(); ctx.moveTo(x,base); ctx.lineTo(x+10,base-h); ctx.lineTo(x+mw-10,base-h); ctx.lineTo(x+mw,base); ctx.closePath(); ctx.fill();
    ctx.fillStyle=TREE[1].cap; ctx.fillRect(x+10,base-h,mw-20,4);
    ctx.fillStyle=TREE[1].rock2; ctx.fillRect(x+12,base-h+14,mw-24,2);
  } else if(s===2){
    ctx.fillStyle=TREE[2].trunk; ctx.fillRect(x-3,base-h,6,h);
    ctx.fillStyle=TREE[2].c1;
    ctx.beginPath(); ctx.arc(x,base-h-6,22+(k%2)*4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=TREE[2].c2;
    ctx.beginPath(); ctx.arc(x-12,base-h,11,0,Math.PI*2); ctx.arc(x+10,base-h+2,10,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=TREE[2].c3; ctx.fillRect(x-6,base-h-14,5,4);
  } else {
    ctx.fillStyle=TREE[3].pine;
    for(var t=0;t<3;t++){
      var ty=base-h+t*12, tw=22-t*5;
      ctx.beginPath(); ctx.moveTo(x,ty-14); ctx.lineTo(x+tw,ty+4); ctx.lineTo(x-tw,ty+4); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle=TREE[3].snow;
    ctx.fillRect(x-3,base-h-14,6,3);
    ctx.fillRect(x-6,base-h-4,12,2);
  }
}
function drawTrees(){
  for(var s=0;s<4;s++){
    var w=sw(s);
    if(w<0.02) continue;
    ctx.save(); ctx.globalAlpha=w*0.9;
    var k0=Math.floor(treeOff/150);
    for(var i=-1;i<6;i++){
      var x=i*150-mod(treeOff,150)+150;
      treeAt(s,x,k0+i+10);
    }
    ctx.restore();
  }
}

/* ---------- ground: season surfaces ---------- */
function groundDecor(s){
  var off=groundOff, x;
  if(s===0){ /* spring: grass tufts and blossoms */
    ctx.fillStyle='#3f8f3a';
    for(x=-mod(off,10);x<W;x+=10){ ctx.fillRect(x,GROUND_Y+3,2,4); ctx.fillRect(x+3,GROUND_Y+2,2,5); }
    ctx.fillStyle='#ff9ac4';
    for(x=-mod(off,64);x<W;x+=64){ ctx.fillRect(x+6,GROUND_Y+12,3,3); }
    ctx.fillStyle='#fff3a0';
    for(x=-mod(off,64)+36;x<W;x+=64){ ctx.fillRect(x,GROUND_Y+18,2,2); }
  } else if(s===1){ /* summer: sand ripples */
    ctx.fillStyle='rgba(255,236,190,0.35)';
    for(var y=GROUND_Y+20;y<H;y+=14){
      for(x=-mod(off,30);x<W;x+=30){ ctx.fillRect(x,y,14,1); }
    }
  } else if(s===2){ /* autumn: fallen leaves on the path */
    for(var i=0;i<18;i++){
      var lx=mod(i*41-off,W), ly=GROUND_Y+6+(i*11)%40;
      ctx.fillStyle=LEAVES[i%3];
      ctx.fillRect(lx,ly,3,2);
    }
  } else { /* winter: snow bumps and ice patches */
    ctx.fillStyle='#ffffff';
    for(x=-mod(off,16);x<W;x+=16){
      ctx.beginPath(); ctx.arc(x+8,GROUND_Y+2,7,Math.PI,0); ctx.fill();
    }
    for(x=-mod(off,150)+20;x<W;x+=150){
      ctx.fillStyle='rgba(170,230,255,0.9)'; ctx.fillRect(x,GROUND_Y+20,50,3);
      ctx.fillStyle='rgba(230,248,255,0.95)'; ctx.fillRect(x+8,GROUND_Y+17,30,2);
      ctx.fillStyle='rgba(150,215,245,0.8)'; ctx.fillRect(x+4,GROUND_Y+24,36,2);
    }
  }
}
function drawGround(){
  ctx.fillStyle=rgb(PAL.groundDark,1);
  ctx.fillRect(0,GROUND_Y,W,GROUND_H);
  ctx.fillStyle=rgb(PAL.ground,1);
  ctx.fillRect(0,GROUND_Y,W,8);
  for(var s=0;s<4;s++){
    var w=sw(s);
    if(w<0.01) continue;
    ctx.globalAlpha=w;
    groundDecor(s);
    ctx.globalAlpha=1;
  }
  ctx.save();
  ctx.shadowColor=rgb(PAL.rim,1);
  ctx.shadowBlur=10;
  ctx.fillStyle=rgb(PAL.rim,1);
  ctx.fillRect(0,GROUND_Y,W,2);
  ctx.restore();
}

/* ---------- obstacles ---------- */
function rr(x,y,w,h,c){
  ctx.fillStyle=COL.K; ctx.fillRect(x,y,w,h);
  ctx.fillStyle=c; ctx.fillRect(x+2,y+2,w-4,h-4);
}
function drawObstacle(o){
  var x=Math.floor(o.x), gy=GROUND_Y;
  if(o.k==='log'){
    rr(x,gy-o.h,o.w,o.h,'#8a5a34');
    ctx.fillStyle='#4f8f4e'; ctx.fillRect(x+2,gy-o.h+2,o.w-4,3);
    ctx.fillStyle='#c98a52'; ctx.fillRect(x+4,gy-o.h+8,5,o.h-12);
    ctx.fillStyle='#5a3a20'; ctx.fillRect(x+o.w-9,gy-o.h+8,4,o.h-12);
  } else if(o.k==='rock'){
    rr(x,gy-o.h,o.w,o.h,'#c98a52');
    ctx.fillStyle='#a8603a'; ctx.fillRect(x+2,gy-o.h+o.h*0.6,o.w-4,o.h*0.4-2);
    ctx.fillStyle='#f4d29a'; ctx.fillRect(x+4,gy-o.h+4,o.w-12,3);
  } else if(o.k==='fallen'){
    rr(x,gy-o.h,o.w,o.h,'#5a3a20');
    for(var i=0;i<5;i++){ ctx.fillStyle=LEAVES[i%4]; ctx.fillRect(x+4+i*9,gy-o.h-3,5,4); }
    ctx.fillStyle='#8a5a34'; ctx.fillRect(x+4,gy-o.h+8,o.w-12,3);
  } else if(o.k==='boulder'){
    rr(x,gy-o.h,o.w,o.h,'#dff4ff');
    ctx.fillStyle='#9fd8f0'; ctx.fillRect(x+2,gy-o.h*0.45,o.w-4,o.h*0.45-2);
    ctx.fillStyle='#ffffff'; ctx.fillRect(x+4,gy-o.h+3,o.w-14,3);
  } else if(o.k==='blossom'){
    ctx.fillStyle=COL.K; ctx.fillRect(x,AIR_Y+6,o.w,4);
    ctx.fillStyle='#6b4a2a'; ctx.fillRect(x+2,AIR_Y+8,o.w-4,2);
    var pts=[[8,4],[o.w*0.5,2],[o.w-10,6]];
    for(var b=0;b<pts.length;b++){
      ctx.fillStyle=COL.K;
      ctx.beginPath(); ctx.arc(x+pts[b][0],AIR_Y+AIR_H-6,8,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=(b%2)?'#ff8fbf':'#ffb3d1';
      ctx.beginPath(); ctx.arc(x+pts[b][0],AIR_Y+AIR_H-6,6.5,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#ffffff'; ctx.fillRect(x+pts[b][0]-2,AIR_Y+AIR_H-8,2,2);
    }
  } else if(o.k==='slab'){
    rr(x,AIR_Y,o.w,AIR_H,'#c97a48');
    ctx.fillStyle='#a8603a'; ctx.fillRect(x+2,AIR_Y+AIR_H-6,o.w-4,4);
    ctx.fillStyle='#f4d29a'; ctx.fillRect(x+4,AIR_Y+3,o.w-14,3);
    for(var sk=0;sk<o.w;sk+=16){
      ctx.fillStyle='#a8603a';
      ctx.beginPath(); ctx.moveTo(x+sk+4,AIR_Y+AIR_H); ctx.lineTo(x+sk+8,AIR_Y+AIR_H+5); ctx.lineTo(x+sk+12,AIR_Y+AIR_H); ctx.closePath(); ctx.fill();
    }
  } else if(o.k==='branch'){
    ctx.fillStyle='#3a2412'; ctx.fillRect(x,AIR_Y+6,o.w,4);
    ctx.fillRect(x+6,AIR_Y+2,3,8); ctx.fillRect(x+o.w-14,AIR_Y+1,3,9);
    for(var lf=0;lf<4;lf++){
      ctx.fillStyle=LEAVES[lf%3];
      ctx.fillRect(x+4+lf*14,AIR_Y+AIR_H-6,5,4);
      ctx.fillRect(x+10+lf*14,AIR_Y+AIR_H-3,4,3);
    }
  } else if(o.k==='icicle'){
    ctx.fillStyle='#cfeeff'; ctx.fillRect(x,AIR_Y,o.w,6);
    for(var ic=0;ic<o.w;ic+=9){
      ctx.fillStyle=COL.K;
      ctx.beginPath(); ctx.moveTo(x+ic+1,AIR_Y+5); ctx.lineTo(x+ic+9,AIR_Y+5); ctx.lineTo(x+ic+5,AIR_Y+AIR_H+1); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#eefcff';
      ctx.beginPath(); ctx.moveTo(x+ic+2,AIR_Y+6); ctx.lineTo(x+ic+8,AIR_Y+6); ctx.lineTo(x+ic+5,AIR_Y+AIR_H); ctx.closePath(); ctx.fill();
    }
  }
}

/* spawn a new obstacle for the current season, pushed past the right edge */
function spawnObstacle(){
  var s=zoneN%4;
  var air=score>=15 && Math.random()<0.28;
  var o;
  if(air){
    var ak=AIR_KIND[s];
    o={k:ak, air:true, x:W+4, w:AIR_SIZE[ak].w, h:AIR_H, s:s};
  } else {
    var gk=GROUND_KIND[s];
    var g=GROUND_SIZE[gk];
    o={k:gk, air:false, x:W+4, w:g.w+(Math.random()<0.5?0:6), h:g.h, s:s};
  }
  obs.push(o);
  nextGap=speed*(44+Math.random()*46);
}

/* ---------- Prime sprite: running, jump and slide poses ---------- */
function px(rows, r0, r1, x, y){
  for(var r=r0;r<r1;r++){
    var row=rows[r];
    for(var c=0;c<row.length;c++){
      var ch=row.charAt(c);
      if(ch!=='.' && COL[ch]){
        ctx.fillStyle=COL[ch];
        ctx.fillRect(x+c*P, y+(r-r0)*P, P, P);
      }
    }
  }
}
function drawPrime(){
  var feet=GROUND_Y-player.lift;
  var x=PX;
  var fr=Math.floor(player.anim)%4;
  if(duckNow){
    /* slide: flat body on the path, dust streaks behind */
    ctx.fillStyle='rgba(255,255,255,0.6)';
    var dd=Math.floor(player.anim*3)%6;
    ctx.fillRect(x-6-dd, feet-6, 4, 2);
    ctx.fillRect(x-12-dd, feet-12, 3, 2);
    px(ROBOT, 3, 9, x, feet-18);
    ctx.fillStyle=COL.K;
    ctx.fillRect(x+4,feet-2,5,2); ctx.fillRect(x+25,feet-2,5,2);
    return;
  }
  if(!player.onGround){
    /* jump: tucked legs and a flickering jet */
    px(ROBOT, 0, 9, x, feet-33);
    ctx.fillStyle=COL.K;
    ctx.fillRect(x+9,feet-6,3,3); ctx.fillRect(x+21,feet-6,3,3);
    var fl=Math.floor(frames/3)%2;
    ctx.fillStyle=fl?'#ffb347':'#ffe27a';
    ctx.fillRect(x+10,feet-3,4,3); ctx.fillRect(x+20,feet-3,4,3);
    ctx.fillStyle='#ffe27a';
    ctx.fillRect(x+11,feet,2,2); ctx.fillRect(x+21,feet,2,2);
    return;
  }
  /* run: body bobs, legs swing in a 4-frame cycle */
  var bob=(fr===1||fr===3)?-1:0;
  px(ROBOT, 0, 9, x, feet-33+bob);
  var sw2=[0,2,0,-2][fr];
  ctx.fillStyle=COL.K;
  ctx.fillRect(x+9+sw2, feet-6, 3, 6);
  ctx.fillRect(x+21-sw2, feet-6, 3, 6);
  ctx.fillRect(x+8+sw2, feet-2, 5, 2);
  ctx.fillRect(x+20-sw2, feet-2, 5, 2);
}
function playerBox(){
  var feet=GROUND_Y-player.lift;
  if(duckNow) return {x:PX+3, y:feet-18, w:30, h:18};
  return {x:PX+5, y:feet-33, w:26, h:33};
}
function obstacleBox(o){
  if(o.air) return {x:o.x+3, y:AIR_Y, w:o.w-6, h:AIR_H};
  return {x:o.x+3, y:GROUND_Y-o.h, w:o.w-6, h:o.h};
}
function overlap(a,b){
  return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;
}

/* ---------- particles: petals, dust, leaves, snow ---------- */
function updateParts(f){
  PARTS.forEach(function(p){
    p.ph+=0.04*f;
    if(p.s===0){ p.y+=0.7*f; p.x+=(-0.5+0.5*Math.sin(p.ph))*f; }
    else if(p.s===1){ p.y+=0.15*f*Math.sin(p.ph*0.5); p.x-=1.3*f; }
    else if(p.s===2){ p.y+=0.9*f; p.x+=(-0.6+0.6*Math.sin(p.ph))*f; }
    else { p.y+=0.8*f; p.x+=(-0.15+0.4*Math.sin(p.ph))*f; }
    if(p.y>GROUND_Y+4 || p.x<-8){ p.y=-6; p.x=Math.random()*(W+20); }
  });
}
function drawParts(){
  var dim=1-0.65*NIGHT;
  PARTS.forEach(function(p){
    var w=sw(p.s);
    if(w<0.02) return;
    var a=w*dim;
    if(p.s===0){
      ctx.fillStyle='rgba(255,176,206,'+(0.92*a).toFixed(3)+')';
      ctx.fillRect(Math.floor(p.x),Math.floor(p.y),3,2);
    } else if(p.s===1){
      ctx.fillStyle='rgba(255,226,170,'+(0.55*a).toFixed(3)+')';
      ctx.fillRect(Math.floor(p.x),Math.floor(p.y),2,1);
    } else if(p.s===2){
      ctx.globalAlpha=a;
      ctx.fillStyle=LEAVES[p.c];
      ctx.fillRect(Math.floor(p.x),Math.floor(p.y),3,3);
      ctx.fillStyle=LEAVES[3]; ctx.fillRect(Math.floor(p.x)+1,Math.floor(p.y)+1,2,1);
      ctx.globalAlpha=1;
    } else {
      ctx.fillStyle='rgba(255,255,255,'+(0.9*a).toFixed(3)+')';
      ctx.fillRect(Math.floor(p.x),Math.floor(p.y),p.sz>1?2:1,p.sz>1?2:1);
    }
  });
}

/* ---------- audio: generative ambient pad + soft SFX (WebAudio, no files) ---------- */
var ac=null, master=null, ambBus=null, sfxBus=null, noiseBuf=null, ambTimer=null, lfoGain=null;
function ensureAudio(){
  if(ac){ if(ac.state==='suspended' && ac.resume) ac.resume(); return ac; }
  var AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return null;
  try{ ac=new AC(); }catch(e){ ac=null; return null; }
  master=ac.createGain();
  master.gain.value=muted?0:1;
  master.connect(ac.destination);
  ambBus=ac.createGain(); ambBus.gain.value=0.042;
  sfxBus=ac.createGain(); sfxBus.gain.value=0.33;
  /* soft echo shared by pad and sfx */
  var dl=ac.createDelay(1.0); dl.delayTime.value=0.41;
  var fb=ac.createGain(); fb.gain.value=0.3;
  var wet=ac.createGain(); wet.gain.value=0.22;
  dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(master);
  ambBus.connect(master); ambBus.connect(dl);
  sfxBus.connect(master); sfxBus.connect(dl);
  /* slow filter sweep LFO shared by all pad filters */
  var lfo=ac.createOscillator(); lfo.frequency.value=0.05;
  lfoGain=ac.createGain(); lfoGain.gain.value=200;
  lfo.connect(lfoGain); lfo.start();
  /* one second of white noise for whooshes */
  noiseBuf=ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  var nd=noiseBuf.getChannelData(0);
  for(var i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
  startAmbient();
  return ac;
}
function mtof(m){ return 440*Math.pow(2,(m-69)/12); }
var chordIdx=0;
function playChord(t0){
  var M=SEASON_MUSIC[zoneN%4];
  var ch=M.chords[chordIdx%M.chords.length];
  chordIdx++;
  var dur=9;
  var lp=ac.createBiquadFilter();
  lp.type='lowpass'; lp.frequency.value=M.lp; lp.Q.value=0.4;
  lfoGain.connect(lp.frequency);
  lp.connect(ambBus);
  ch.forEach(function(m,vi){
    var f=mtof(m);
    var g=ac.createGain();
    var peak=0.11/ch.length*2*M.gain;
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(peak,t0+3);
    g.gain.setValueAtTime(peak,t0+dur-3);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur+1.5);
    g.connect(lp);
    var o=ac.createOscillator(); o.type='sine'; o.frequency.value=f; o.detune.value=(vi-1.5)*4;
    var o2=ac.createOscillator(); o2.type='triangle'; o2.frequency.value=f; o2.detune.value=-7+vi*2.5;
    var o2g=ac.createGain(); o2g.gain.value=0.35;
    o.connect(g); o2.connect(o2g); o2g.connect(g);
    o.start(t0); o2.start(t0);
    o.stop(t0+dur+2); o2.stop(t0+dur+2);
  });
  /* occasional bell on top of the chord */
  if(Math.random()<0.6){
    var bt=t0+2+Math.random()*4;
    var bo=ac.createOscillator(); bo.type='sine'; bo.frequency.value=mtof(ch[3]+12);
    var bg=ac.createGain();
    bg.gain.setValueAtTime(0.0001,bt);
    bg.gain.exponentialRampToValueAtTime(0.05*M.gain,bt+0.6);
    bg.gain.exponentialRampToValueAtTime(0.0001,bt+4);
    bo.connect(bg); bg.connect(ambBus);
    bo.start(bt); bo.stop(bt+4.2);
  }
}
function startAmbient(){
  if(ambTimer) return;
  function next(){
    if(!ac) return;
    playChord(ac.currentTime+0.05);
    ambTimer=setTimeout(next, 8000);
  }
  next();
}
function toggleMute(){
  muted=!muted;
  try{ localStorage.setItem(MUTE_KEY, muted?'1':'0'); }catch(e){}
  if(master && ac) master.gain.setTargetAtTime(muted?0:1, ac.currentTime, 0.05);
}
/* soft chime (milestones) */
function chime(f,vol){
  if(!ac) return;
  var t=ac.currentTime;
  [f, f*1.5].forEach(function(ff,i){
    var o=ac.createOscillator(); o.type='sine'; o.frequency.value=ff;
    var g=ac.createGain();
    var v=(vol||0.1)*(i?0.4:1);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(v,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.9);
    o.connect(g); g.connect(sfxBus);
    o.start(t); o.stop(t+1);
  });
}
/* gentle rising blip plus a soft whoosh (jump) */
function jumpSfx(){
  if(!ac) return;
  var t=ac.currentTime;
  var o=ac.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(330,t);
  o.frequency.exponentialRampToValueAtTime(660,t+0.18);
  var g=ac.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.09,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.22);
  o.connect(g); g.connect(sfxBus);
  o.start(t); o.stop(t+0.25);
  whoosh(350,1300,0.16,0.22);
}
/* soft low whoosh (slide start, landing puff) */
function whoosh(f1,f2,vol,dur){
  if(!ac||!noiseBuf) return;
  var t=ac.currentTime;
  var src=ac.createBufferSource(); src.buffer=noiseBuf;
  var bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.2;
  bp.frequency.setValueAtTime(f1,t);
  bp.frequency.exponentialRampToValueAtTime(f2,t+dur*0.8);
  var g=ac.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.03);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(bp); bp.connect(g); g.connect(sfxBus);
  src.start(t, Math.random()*0.5); src.stop(t+dur+0.05);
}
function slideSfx(){ whoosh(220,520,0.12,0.2); }
/* muffled thud (hit) */
function thud(){
  if(!ac) return;
  var t=ac.currentTime;
  var o=ac.createOscillator(); o.type='triangle';
  o.frequency.setValueAtTime(150,t);
  o.frequency.exponentialRampToValueAtTime(45,t+0.3);
  var lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=380;
  var g=ac.createGain();
  g.gain.setValueAtTime(0.5,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.4);
  o.connect(lp); lp.connect(g); g.connect(sfxBus);
  o.start(t); o.stop(t+0.45);
}

/* ---------- game logic ---------- */
function reset(){
  distance=0; score=0; speed=SPEED0;
  newBest=false; shake=0;
  player={lift:0, vy:0, onGround:true, anim:player.anim};
  obs=[];
  nextGap=0;
  zoneN=0; zoneFrom=0; blendF=1;
  lastMilestone=0;
}
function jump(){
  if(!player.onGround) return;
  player.vy=JUMP;
  player.onGround=false;
  jumpSfx();
}
function die(){
  state='dead';
  deadAt=frames;
  shake=12;
  thud();
  if(score>best){ best=score; newBest=true; storeBest(best); }
}
/* tap, space or swipe while playing jumps. retries after the game over screen settles */
function action(){
  ensureAudio();
  if(state==='ready'){
    reset(); state='play'; jump(); return;
  }
  if(state==='dead'){
    if(frames-deadAt>35){ reset(); state='play'; jump(); }
    return;
  }
  jump();
}

function update(f){
  if(shake>0) shake=Math.max(0,shake-f);
  frames+=f;
  if(state==='ready'){
    groundOff+=2*f; hillOff+=0.7*f; treeOff+=1.2*f;
    player.anim+=0.15*f;
    updateParts(f);
    return;
  }
  if(state==='dead'){
    updateParts(f*0.3);
    return;
  }
  /* playing */
  speed=Math.min(SPEED_MAX, speed+SPEED_RAMP*f);
  var step=speed*f;
  distance+=step;
  score=Math.floor(distance/DIST_PER_PT);
  if(score>=lastMilestone+100){ lastMilestone+=100; chime(660,0.09); }

  var targetZone=Math.floor(score/ZONE_PTS);
  if(targetZone!==zoneN){ zoneFrom=zoneN; zoneN=targetZone; blendF=0; }
  if(blendF<1) blendF=Math.min(1, blendF+f/ZONE_BLEND_FRAMES);

  groundOff+=step; hillOff+=step*0.35; treeOff+=step*0.6;
  player.anim+=step*0.12;
  updateParts(f);

  /* duck is only possible on the ground; holding it while airborne fast-falls */
  var wantDuck=duckHeld||duckTouch;
  if(wantDuck && player.onGround && !duckNow) slideSfx();
  duckNow=wantDuck && player.onGround;

  if(!player.onGround){
    player.vy-= GRAV*(wantDuck?FAST_FALL:1)*f;
    player.lift+=player.vy*f;
    if(player.lift<=0){
      player.lift=0; player.vy=0; player.onGround=true;
    }
  }

  /* spawn: a gap of speed-scaled distance after the last obstacle */
  var last=obs.length?obs[obs.length-1]:null;
  if(!last || (W-(last.x+last.w))>=nextGap){
    if(score>=0) spawnObstacle();
  }
  for(var i=obs.length-1;i>=0;i--){
    var o=obs[i];
    o.x-=step;
    if(o.x+o.w<-20) obs.splice(i,1);
  }
  /* collision */
  var pb=playerBox();
  for(var j=0;j<obs.length;j++){
    if(overlap(pb,obstacleBox(obs[j]))){ die(); return; }
  }
}

/* ---------- HUD and screens ---------- */
function txt(s,x,y,size,color){
  ctx.font='bold '+size+'px "Courier New", Courier, monospace';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.lineJoin='round';
  ctx.lineWidth=Math.max(3,Math.round(size/6));
  ctx.strokeStyle=COL.K;
  ctx.strokeText(s,x,y);
  ctx.fillStyle=color;
  ctx.fillText(s,x,y);
}
function hudTag(s,x,y,color,right){
  ctx.font='bold 10px "Courier New", Courier, monospace';
  ctx.textAlign='left';
  ctx.textBaseline='middle';
  var w=Math.ceil(ctx.measureText(s).width)+10, h=16;
  var bx=right ? x-w : x;
  ctx.fillStyle=COL.K; ctx.fillRect(bx,y,w,h);
  ctx.fillStyle=color; ctx.fillRect(bx+2,y+2,w-4,h-4);
  ctx.fillStyle=COL.K; ctx.fillText(s,bx+5,y+h/2+0.5);
  return w;
}
function drawHUD(){
  hudTag('BEST '+best, 8, 10, '#ffe27a', false);
  hudTag(SEASON_NAMES[zoneN%4], MUTE_BOX.x-6, 10, rgb(PAL.rim,1), true);
  if(state==='play') txt(String(score), W/2, 32, 28, '#ffffff');
}
function drawTitle(){
  txt('PRIME RUN', W/2, 66, 44, '#ffffff');
  txt('four seasons, one robot', W/2, 102, 13, '#d6f5a8');
  if(Math.floor(frames/30)%2===0) txt('tap or space to jump', W/2, 140, 14, '#ffffff');
  txt('down arrow or swipe down to slide', W/2, 162, 12, '#ffffff');
  txt('M to mute', W/2, 182, 11, '#ffffff');
  txt('BEST '+best, W/2, 210, 15, '#ffe27a');
}
function drawGameOver(){
  ctx.fillStyle='rgba(255,244,214,0.96)';
  ctx.fillRect(W/2-120,40,240,184);
  ctx.strokeStyle=COL.K; ctx.lineWidth=2;
  ctx.strokeRect(W/2-120,40,240,184);
  txt('GAME OVER', W/2, 66, 24, '#e03a3a');
  txt('SCORE', W/2, 96, 13, '#14142b');
  txt(String(score), W/2, 118, 26, '#14142b');
  txt('BEST', W/2, 146, 13, '#14142b');
  txt(String(best), W/2, 166, 22, '#14142b');
  if(newBest && Math.floor(frames/20)%2===0) txt('NEW BEST!', W/2, 196, 15, '#e03a3a');
  if(frames-deadAt>35 && Math.floor(frames/25)%2===0) txt('tap or space to retry', W/2, 262, 14, '#ffffff');
}
function drawMuteBtn(){
  var b=MUTE_BOX;
  ctx.fillStyle='rgba(8,20,14,0.7)';
  ctx.fillRect(b.x,b.y,b.w,b.h);
  var col = muted ? '#ff7a7a' : '#ffffff';
  ctx.strokeStyle=col;
  ctx.lineWidth=1;
  ctx.strokeRect(b.x+0.5,b.y+0.5,b.w-1,b.h-1);
  var cx=b.x+6, cy=b.y+b.h/2;
  ctx.fillStyle = col;
  ctx.fillRect(cx-2,cy-2,3,4);
  ctx.beginPath();
  ctx.moveTo(cx+1,cy-2); ctx.lineTo(cx+5,cy-5); ctx.lineTo(cx+5,cy+5); ctx.lineTo(cx+1,cy+2);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = col;
  ctx.beginPath();
  if(!muted){
    ctx.arc(cx+5,cy,4,-0.8,0.8);
    ctx.moveTo(cx+9,cy); ctx.arc(cx+5,cy,8,-0.8,0.8);
  } else {
    ctx.moveTo(cx+8,cy-4); ctx.lineTo(cx+14,cy+4);
    ctx.moveTo(cx+14,cy-4); ctx.lineTo(cx+8,cy+4);
  }
  ctx.stroke();
}

function render(){
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  drawSky();
  drawBodies();
  drawStars();
  drawHills();
  drawTrees();
  drawGround();
  for(var i=0;i<obs.length;i++) drawObstacle(obs[i]);
  drawPrime();
  /* night tint over the whole playfield */
  ctx.fillStyle='rgba(8,14,40,'+(0.32*NIGHT).toFixed(3)+')';
  ctx.fillRect(0,0,W,H);
  drawParts();
  ctx.restore();

  drawHUD();
  if(state==='ready') drawTitle();
  else if(state==='dead') drawGameOver();
  drawMuteBtn();
}

/* ---------- input ---------- */
function inMuteBox(e){
  var r=cv.getBoundingClientRect();
  var x=(e.clientX-r.left)*W/r.width, y=(e.clientY-r.top)*H/r.height;
  var b=MUTE_BOX;
  return x>=b.x-4 && x<=b.x+b.w+4 && y>=b.y-4 && y<=b.y+b.h+4;
}
window.addEventListener('pointerdown', function(e){
  if(e.preventDefault) e.preventDefault();
  if(inMuteBox(e)){ ensureAudio(); toggleMute(); return; }
  pStartY=e.clientY;
  action();
}, {passive:false});
window.addEventListener('pointermove', function(e){
  if(pStartY===null) return;
  if(e.clientY-pStartY>28) duckTouch=true;
}, {passive:true});
function endTouch(){ pStartY=null; duckTouch=false; }
window.addEventListener('pointerup', endTouch);
window.addEventListener('pointercancel', endTouch);
window.addEventListener('touchstart', function(e){
  if(e.cancelable) e.preventDefault();
}, {passive:false});
window.addEventListener('touchmove', function(e){
  if(e.cancelable) e.preventDefault();
}, {passive:false});
window.addEventListener('keydown', function(e){
  if(e.code==='KeyM' && !e.repeat){ ensureAudio(); toggleMute(); return; }
  if(e.code==='ArrowDown' || e.code==='KeyS'){
    if(e.preventDefault) e.preventDefault();
    duckHeld=true;
    return;
  }
  if(e.code==='Space' || e.code==='ArrowUp' || e.code==='Enter'){
    if(e.preventDefault) e.preventDefault();
    if(!e.repeat) action();
  }
});
window.addEventListener('keyup', function(e){
  if(e.code==='ArrowDown' || e.code==='KeyS') duckHeld=false;
});
window.addEventListener('blur', function(){ duckHeld=false; duckTouch=false; });
window.addEventListener('contextmenu', function(e){ e.preventDefault(); });

/* ---------- init and loop ---------- */
reset();
state='ready';
computePal();

var lastT=null;
function loop(t){
  var dt=(lastT===null)?16.667:(t-lastT);
  lastT=t;
  if(!(dt>0)) dt=16.667;
  dt=Math.min(dt,50);
  var f=dt/(1000/60);
  update(f);
  computePal();
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
